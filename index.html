    --accent:#e5601f;      /* laranja ativo */
    --coral:#f26b66;       /* saldo negativo */
    --green:#2aa858;       /* entradas / saldo positivo */
    --entrada:#26a65a;
    --saida:#c1481c;
    --diario:#e5228e;
    --economia:#8fbf1f;
    --cartao:#7a2fe0;
    --done:#37b24d;        /* dia concluído */
    --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05);
    --radius:20px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
    /* animação estilo iOS */
    --ease-ios:cubic-bezier(.32,.72,0,1);
    --ease-out:cubic-bezier(.22,1,.36,1);
    --ease-in:cubic-bezier(.55,.06,.68,.19);
    --dur-fast:.18s;
    --dur:.28s;
    --dur-slow:.42s;
    --press:cubic-bezier(.2,.7,.4,1);
  }
  [data-theme="dark"]{
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#161618;
    --line:#2a2a2d;
    --line-strong:#333338;
    --txt:#f5f5f7;
    --txt-2:#98989f;
    --txt-3:#5a5a60;
    --coral:#e15a55;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg);color:var(--txt);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
  }
  #app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--surface);
    padding:calc(var(--safe-top) + 14px) 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .cal-badge{width:44px;height:44px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line-strong);position:relative;display:flex;align-items:flex-end;
    justify-content:center;padding-bottom:5px;font-weight:800;font-size:18px;overflow:hidden;flex:0 0 auto;}
  .cal-badge::before{content:"";position:absolute;top:0;left:0;right:0;height:11px;background:var(--accent);}
  .cal-badge::after{content:"";position:absolute;top:2px;left:9px;width:4px;height:6px;border-radius:2px;
    background:var(--txt);box-shadow:18px 0 0 var(--txt);}
  .month-nav{display:flex;align-items:center;gap:14px;}
  .month-nav .arrow{color:var(--txt-2);width:32px;height:32px;line-height:1;display:flex;align-items:center;justify-content:center;}
  /* traço das setas: 2.6 contra o ~1px dos glifos de texto */
  .arrow svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;
    stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
  .month-label{font-size:27px;font-weight:800;letter-spacing:-.5px;min-width:118px;text-align:center;}
  /* atalho de busca no canto superior direito (ocupa o lugar do antigo botão decorativo) */
  .topbar-search{width:44px;height:44px;flex:0 0 auto;border:none;background:none;padding:0;
    display:flex;align-items:center;justify-content:center;color:var(--txt);}
  .topbar-search svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;
    stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
  .topbar-search:active{transform:scale(.9);}

  /* ---------- Filter bar (saldos) ---------- */
  .subbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;
    color:var(--txt-2);font-size:16px;}
  .filter-pill{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid var(--line-strong);
    border-radius:30px;background:var(--surface);font-weight:800;color:var(--txt);font-size:17px;}
  .subbar .filter-pill{width:210px;justify-content:center;}
  .filter-pill .chev{color:var(--txt-3);font-size:13px;}
  .badge{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:13px;flex:0 0 auto;}
  .badge svg{width:15px;height:15px;}
  .badge.entrada{background:var(--entrada);} .badge.saida{background:var(--saida);}
  .badge.diario{background:var(--diario);} .badge.economia{background:var(--economia);}
  /* previsão: mesmo "D" do diário, mas em contorno tracejado — valor projetado, não real */
  .badge.previsao{background:transparent;border:2px dashed var(--diario);color:var(--diario);}
  .badge.previsao.muted{opacity:.45;}
  .badge.cartao{background:var(--cartao);} .badge.todas{background:var(--txt-2);}
  .badge.muted{background:#d2d2d8;} [data-theme="dark"] .badge.muted{background:#3a3a3d;}

  /* ---------- Content ---------- */
  .screen{padding-bottom:120px;}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* saldos: barra fixa + só a lista rola + arrastar p/ trocar coluna */
  body.saldos-active{height:100dvh;overflow:hidden;}
  body.saldos-active #app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  body.saldos-active #header{flex:0 0 auto;}
  body.saldos-active #content{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:0;}
  body.saldos-active #content>.subbar{flex:0 0 auto;background:var(--bg);}
  body.saldos-active #content>.saldos-scroll{flex:1 1 auto;min-height:0;}
  .saldos-scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;}
  .saldos-track{padding-bottom:calc(var(--safe-bot) + 78px);}

  /* saldos rows */
  .balrow{display:grid;grid-template-columns:46px 1fr 150px;align-items:stretch;border-bottom:1px solid var(--line);
    background:var(--surface);min-height:54px;position:relative;}
  .balrow .day{display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--txt);position:relative;}
  .balrow .day.today{background:var(--txt);color:var(--surface);}
  .balrow .amt{overflow:hidden;font-size:17px;font-weight:600;}
  .balrow .amt .val{margin-left:auto;text-align:right;}
  .balrow .amt.zero{color:var(--txt-3);} .balrow .amt.zero .badge{background:#d2d2d8;}
  [data-theme="dark"] .balrow .amt.zero .badge{background:#3a3a3d;}
  /* só a coluna do meio (valores) desliza; dia e saldos ficam fixos */
  .amt-slide{display:flex;align-items:center;gap:12px;padding:0 6px 0 4px;height:100%;min-width:0;
    transform:translateX(var(--sldx,0));opacity:var(--sldo,1);}
  .saldos-scroll.sliding .amt-slide{transition:transform var(--dur) var(--ease-ios),opacity var(--dur) var(--ease-ios);}
  .balrow .bal{display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-size:16.5px;font-weight:600;
    white-space:nowrap;border-left:1px solid var(--line);}

  /* todas grouped */
  .dayblock{border-bottom:1px solid var(--line-strong);}
  .subrow{display:grid;grid-template-columns:46px 1fr 150px;align-items:center;min-height:46px;background:var(--surface);
    border-top:1px solid var(--line);}
  .subrow:first-child{border-top:none;}
  .subrow .lead{display:flex;align-items:center;justify-content:center;position:relative;align-self:stretch;}
  .subrow .lead .n{font-size:17px;font-weight:600;}
  .subrow .lead .n.today{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
    border-radius:999px;background:var(--txt);color:var(--surface);font-weight:800;}
  .subrow .amt{overflow:hidden;font-size:17px;font-weight:600;}
  .subrow .amt .val{margin-left:auto;}
  .subrow .amt.zero{color:var(--txt-3);}
  .subrow .bal{align-self:stretch;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;font-weight:700;font-size:16px;white-space:nowrap;}

  /* dia concluído (marcação manual) — só o canto verde no número do dia */
  .balrow .day[data-done],.subrow .lead[data-done]{cursor:pointer;}
  .balrow.done .day::before,.dayblock.done .subrow:first-child .lead::before{
    content:"";position:absolute;top:0;left:0;border-style:solid;border-width:16px 16px 0 0;
    border-color:var(--done) transparent transparent transparent;}
  .done-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:14px;
    background:var(--surface-2);border:1px solid var(--line-strong);color:var(--txt);font-size:16px;font-weight:700;}
  .done-toggle .dt-box{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:2px solid var(--txt-3);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;}
  .done-toggle.on{border-color:var(--done);color:var(--done);}
  .done-toggle.on .dt-box{background:var(--done);border-color:var(--done);}

  /* modal de escolha (repetidas) */
  #modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:26px;
    background:rgba(0,0,0,.42);opacity:0;visibility:hidden;pointer-events:none;
    transition:opacity var(--dur) var(--ease-out),visibility 0s linear var(--dur);}
  #modal.open{opacity:1;visibility:visible;pointer-events:auto;transition:opacity var(--dur) var(--ease-out);}
  .modal-card{width:100%;max-width:400px;background:var(--surface);border-radius:26px;padding:26px 22px 18px;box-shadow:var(--shadow);
    transform:scale(.9) translateY(10px);opacity:0;transition:transform var(--dur) var(--ease-ios),opacity var(--dur) var(--ease-out);}
  #modal.open .modal-card{transform:none;opacity:1;}
  .modal-title{font-size:25px;font-weight:800;margin-bottom:20px;color:var(--txt);}
  .modal-title+.modal-note{margin-top:-12px;}
  .modal-note{font-size:15px;font-weight:600;line-height:1.45;color:var(--txt-2);margin-bottom:20px;}
  .modal-opt{display:block;width:100%;padding:16px;border-radius:30px;border:1.5px solid var(--line-strong);
    background:var(--surface);color:var(--txt);font-size:17px;font-weight:800;margin-bottom:14px;}
  .modal-opt.danger{color:var(--saida);border-color:var(--saida);}
  .modal-cancel{display:block;width:100%;padding:12px;background:none;color:var(--txt-2);font-size:17px;font-weight:800;}

  /* ---------- Cards / lists (totais, tags, menu) ---------- */
  .section-title{padding:22px 20px 8px;color:var(--txt-2);font-size:16px;font-weight:700;}
  .card{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .rowitem{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .rowitem:last-child{border-bottom:none;}
  .rowitem .label{font-size:18px;font-weight:700;}
  .rowitem .value{margin-left:auto;font-size:18px;font-weight:700;text-align:right;}
  .rowitem .sub{font-size:14px;color:var(--txt-2);font-weight:600;}

  .calc{padding:20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .calc .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .calc .name{font-size:20px;font-weight:800;}
  .calc .big{font-size:20px;font-weight:800;text-align:right;}
  .calc .cap{font-size:15px;color:var(--txt-2);text-align:right;margin-top:2px;font-weight:600;}
  .chips{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .chips .op{color:var(--txt-3);font-weight:800;font-size:17px;}
  .badge.sm{width:24px;height:24px;font-size:12px;}
  .badge.sm svg{width:13px;height:13px;}
  .badge.ring{background:var(--surface);border:2px dashed var(--diario);color:var(--diario);}
  .bar{height:26px;border:2px solid var(--economia);border-radius:20px;flex:1;overflow:hidden;position:relative;background:transparent;}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--economia);border-radius:20px;}

  /* tag color dot */
  .tagdot{width:22px;height:30px;border-radius:5px;flex:0 0 auto;position:relative;}
  .tagdot::after{content:"";position:absolute;right:-7px;top:0;border-style:solid;border-width:15px 0 15px 8px;border-color:transparent;}

  /* menu */
  .menu-row{display:flex;align-items:center;gap:14px;padding:17px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600;}
  .menu-row .chev{margin-left:auto;color:var(--txt-3);font-size:20px;}
  .menu-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:0 0 auto;}
  .menu-ic svg{width:18px;height:18px;stroke:var(--txt);}

  .empty{text-align:center;color:var(--txt-2);padding:70px 30px;font-size:17px;line-height:1.5;}
  .empty b{color:var(--txt);}

  /* ---------- Bottom tab bar ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);
    max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
    padding:8px 6px calc(var(--safe-bot) + 8px);}
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--txt-2);font-size:13px;font-weight:700;padding:4px 0;}
  .tab svg{width:24px;height:24px;stroke:var(--txt-2);fill:none;stroke-width:2;}
  .tab.active{color:var(--accent);}
  .tab.active svg{stroke:var(--accent);}
  .tab.active::before{content:"";position:absolute;top:0;width:46px;height:3px;border-radius:3px;background:var(--accent);}
  .tab{position:relative;}
  .fab-wrap{display:flex;justify-content:center;align-items:flex-start;}
  .fab{width:62px;height:62px;border-radius:50%;background:var(--txt);color:var(--surface);display:flex;
    align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .fab svg{width:30px;height:30px;stroke:var(--surface);stroke-width:2.4;}

  /* ---------- Sheet / modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease-out);
    display:flex;align-items:flex-end;justify-content:center;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:26px 26px 0 0;transform:translateY(100%);
    transition:transform var(--dur-slow) var(--ease-ios);max-height:92dvh;overflow-y:auto;padding-bottom:calc(var(--safe-bot) + 20px);}
  .backdrop.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 6px;}
  .sheet-head h2{margin:0;font-size:27px;font-weight:800;}
  .xbtn{width:34px;height:34px;font-size:26px;color:var(--txt-2);display:flex;align-items:center;justify-content:center;}
  .sheet-opt{display:flex;align-items:center;gap:16px;padding:20px 22px;border-top:1px solid var(--line);font-size:20px;font-weight:700;}

  /* add form */
  .form{padding:6px 22px 0;}
  .type-tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px 0 14px;}
  .type-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:30px;background:var(--bg);
    font-weight:700;font-size:15px;color:var(--txt-2);border:2px solid transparent;}
  .type-tab.sel{color:var(--txt);border-color:var(--txt);background:var(--surface);}
  .amount-box{text-align:center;padding:14px 0 8px;}
  .amount-box .cur{font-size:20px;color:var(--txt-2);font-weight:700;}
  .sign-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);
    color:var(--txt-2);font-size:20px;font-weight:800;line-height:1;vertical-align:middle;margin-right:6px;}
  .sign-btn.neg{border-color:var(--saida);color:var(--saida);}
  .field-hint{font-size:14px;font-weight:600;line-height:1.45;color:var(--txt-2);padding:4px 2px 2px;}
  .fc-month{text-align:center;font-size:15px;font-weight:700;color:var(--txt-2);margin:-4px 0 14px;}
  .fc-help{list-style:none;margin:0 0 4px;padding:14px 16px;background:var(--surface-2);border-radius:16px;
    border:1px solid var(--line);}
  .fc-help li{position:relative;padding-left:24px;margin-bottom:11px;font-size:15px;font-weight:600;
    line-height:1.45;color:var(--txt-2);}
  .fc-help li:last-child{margin-bottom:0;}
  .fc-help li::before{content:"✓";position:absolute;left:0;top:0;color:var(--diario);font-weight:900;}

  /* ---------- Busca (painel flutuante) ---------- */
  #searchview{display:none;position:fixed;inset:0;z-index:60;
    background:rgba(0,0,0,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
    opacity:0;transition:opacity var(--dur) var(--ease-out);
    padding:calc(var(--safe-top) + 10px) 12px 12px;}
  #searchview.show{opacity:1;}
  .sq-panel{max-width:460px;margin:0 auto;background:var(--bg);border-radius:20px;overflow:hidden;
    display:flex;flex-direction:column;max-height:100%;
    box-shadow:0 18px 50px rgba(0,0,0,.34);
    transform:translateY(-14px) scale(.97);opacity:.6;
    transition:transform var(--dur) var(--ease-ios),opacity var(--dur) var(--ease-out);}
  #searchview.show .sq-panel{transform:none;opacity:1;}
  .sq-top{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;background:var(--surface);}
  .sq-close{flex:0 0 auto;border:none;background:none;color:var(--txt-2);font-size:16px;font-weight:700;padding:6px 2px;}
  /* a lista rola DENTRO do painel: os filtros ficam sempre visíveis */
  .sq-results{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);}
  .search-screen{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;}
  .sq-box{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:14px;
    background:var(--surface);border:1px solid var(--line-strong);}
  .sq-box .sq-ic svg{width:19px;height:19px;display:block;fill:none;stroke:var(--txt-3);stroke-width:2.4;
    stroke-linecap:round;stroke-linejoin:round;}
  .sq-box input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:17px;font-weight:600;color:var(--txt);}
  .sq-box input::-webkit-search-cancel-button{display:none;}
  .sq-clear{width:24px;height:24px;border-radius:50%;border:none;background:var(--line-strong);color:var(--txt-2);
    font-size:13px;font-weight:800;flex:0 0 auto;}
  .sq-chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 9px;scrollbar-width:none;background:var(--surface);}
  .sq-chips::-webkit-scrollbar{display:none;}
  .sq-chip{flex:0 0 auto;padding:7px 13px;border-radius:30px;border:1.5px solid var(--line-strong);
    background:var(--surface);color:var(--txt-2);font-size:14px;font-weight:700;white-space:nowrap;
    transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),
      border-color var(--dur-fast) var(--ease-out);}
  .sq-chip.sel{background:var(--txt);border-color:var(--txt);color:var(--surface);}
  .sq-chip:active{transform:scale(.95);}
  .sq-sum{display:flex;justify-content:space-between;align-items:baseline;padding:9px 18px;
    font-size:14px;font-weight:700;color:var(--txt-2);background:var(--surface);
    border-top:1px solid var(--line);}
  .sq-mes{padding:14px 20px 7px;font-size:13px;font-weight:800;color:var(--txt-3);
    text-transform:lowercase;letter-spacing:.3px;background:var(--bg);}

  /* lançamento ainda não pago: valor esmaecido e barra lateral */
  .txrow.pend{position:relative;}
  .txrow.pend .txval{opacity:.55;}
  .txrow.pend::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;
    background:var(--txt-3);}
  .txrow.atraso::before{background:var(--saida);}
  .txrow.atraso .txlbl{color:var(--saida);font-weight:800;}

  /* ---------- Pago x previsto ---------- */
  .pago-toggle{display:flex;align-items:center;gap:11px;width:100%;padding:14px 16px;border-radius:16px;
    background:var(--surface-2);border:1.5px solid var(--line-strong);color:var(--txt-2);
    font-size:16px;font-weight:700;margin-top:14px;
    transition:border-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out);}
  .pago-toggle .pg-box{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:2px solid var(--txt-3);
    display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff;}
  .pago-toggle.on{border-color:var(--green);color:var(--green);}
  .pago-toggle.on .pg-box{background:var(--green);border-color:var(--green);}
  .pago-toggle.late{border-color:var(--saida);color:var(--saida);}
  .pago-toggle.late .pg-box{border-color:var(--saida);}
  .pago-toggle .pg-hint{margin-left:auto;font-size:13px;font-weight:600;color:var(--txt-3);}
  .pago-toggle:active{transform:scale(.98);}

  /* ---------- Fatura ---------- */
  .ft-head{padding:14px 20px 16px;background:var(--surface);border-bottom:1px solid var(--line);}
  .ft-card{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:800;}
  .ft-card .dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto;}
  .ft-stat{margin-left:auto;font-size:12px;font-weight:800;padding:3px 10px;border-radius:30px;
    border:1.5px solid currentColor;text-transform:lowercase;}
  .ft-tot{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-top:8px;}
  .ft-sub{font-size:14px;font-weight:600;color:var(--txt-2);margin-top:4px;line-height:1.45;}
  .perf-row.ft-link{cursor:pointer;}
  .ft-tagmini{margin-left:10px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:30px;
    text-transform:lowercase;border:1.2px solid currentColor;}
  .ft-tagmini.aberta{color:var(--txt-3);}
  .ft-tagmini.fechada{color:var(--saida);}
  .ft-tagmini.paga{color:var(--green);}
  .perf-row.ft-link .pv{margin-left:auto;}

  /* ---------- Aviso de pendências ---------- */
  .al-card{padding:0;overflow:hidden;text-align:left;max-width:390px;}
  .al-head{display:flex;align-items:center;gap:13px;padding:20px 20px 16px;}
  .al-ico{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:var(--saida);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;}
  .al-tit{font-size:21px;font-weight:800;letter-spacing:-.3px;color:var(--txt);}
  .al-sub{font-size:14px;font-weight:700;color:var(--txt-2);margin-top:2px;}
  .al-list{max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .al-sec{padding:11px 20px 7px;font-size:12px;font-weight:800;color:var(--txt-3);
    letter-spacing:.4px;text-transform:lowercase;background:var(--bg);}
  .al-sec.late{color:var(--saida);}
  .al-row{display:flex;align-items:center;gap:11px;padding:12px 20px;background:var(--surface);
    border-top:1px solid var(--line);}
  .al-row:first-of-type{border-top:none;}
  .al-info{flex:1;min-width:0;}
  .al-nm{font-size:16px;font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .al-dt{font-size:13px;font-weight:600;color:var(--txt-2);margin-top:2px;}
  .al-vl{font-size:16px;font-weight:800;color:var(--txt);white-space:nowrap;font-variant-numeric:tabular-nums;}
  /* checkbox: o traço do ✓ é desenhado com stroke-dashoffset para a marcação ser visível */
  .al-chk{width:30px;height:30px;flex:0 0 auto;padding:0;border-radius:9px;
    border:2px solid var(--txt-3);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    transition:background-color .2s var(--ease-out),border-color .2s var(--ease-out),
      transform .26s var(--ease-ios);}
  .al-chk svg{width:17px;height:17px;display:block;fill:none;stroke:#fff;stroke-width:3.4;
    stroke-linecap:round;stroke-linejoin:round;}
  .al-chk svg path{stroke-dasharray:22;stroke-dashoffset:22;}
  .al-chk:active{transform:scale(.88);}
  .al-chk.done{background:var(--green);border-color:var(--green);animation:chkPop .34s var(--ease-ios);}
  .al-chk.done svg path{stroke-dashoffset:0;transition:stroke-dashoffset .26s var(--ease-out) .06s;}
  @keyframes chkPop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}

  .al-row{max-height:78px;overflow:hidden;
    transition:opacity .28s var(--ease-out),transform .28s var(--ease-ios),
      max-height .28s var(--ease-out),padding .28s var(--ease-out);}
  .al-row.done .al-nm,.al-row.done .al-vl{text-decoration:line-through;color:var(--txt-3);
    transition:color .2s var(--ease-out);}
  .al-row.gone{opacity:0;transform:translateX(26px);max-height:0;
    padding-top:0;padding-bottom:0;border-top-width:0;}
  .al-foot{padding:16px 20px 18px;}
  .al-foot .modal-opt{margin-bottom:10px;}
  .al-foot .modal-cancel{margin:0;}
  .amount-box input{border:none;background:none;font-size:48px;font-weight:800;text-align:center;width:100%;color:var(--txt);outline:none;letter-spacing:-1px;}
  .field{padding:14px 0;border-top:1px solid var(--line);}
  .field label{display:block;font-size:14px;color:var(--txt-2);font-weight:700;margin-bottom:7px;}
  .field input[type=text],.field input[type=date],.field select{width:100%;font-size:18px;font-weight:600;padding:12px 14px;
    border:1px solid var(--line-strong);border-radius:14px;background:var(--surface-2);color:var(--txt);outline:none;}
  .hidden{display:none;}
  .save-btn{width:100%;padding:17px;border-radius:16px;background:var(--accent);color:#fff;font-size:19px;font-weight:800;margin:16px 0 6px;}
  .del-btn{width:100%;padding:15px;border-radius:16px;background:transparent;color:var(--saida);font-size:17px;font-weight:800;}
  /* repetir */
  .rep-head{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line);font-size:18px;font-weight:700;cursor:pointer;}
  .rep-head .rep-ic{width:26px;height:26px;flex:0 0 auto;}
  .rep-head .rep-ic svg{width:24px;height:24px;stroke:var(--txt);fill:none;stroke-width:2;}
  .rep-head .rep-name{flex:1 1 auto;min-width:0;}
  .rep-head .chev{color:var(--txt-3);font-size:16px;}
  .rep-head .rep-x{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--txt-2);font-size:20px;font-weight:700;background:var(--bg);}
  .rep-opts{border-top:1px solid var(--line);}
  .rep-opt{padding:14px 0 14px 40px;border-top:1px solid var(--line);cursor:pointer;position:relative;}
  .rep-opt:first-child{border-top:none;}
  .rep-opt .t{font-size:17px;font-weight:800;}
  .rep-opt .d{font-size:13px;color:var(--txt-2);font-weight:600;margin-top:3px;}
  .rep-opt.sel .t{color:var(--accent);}
  .rep-opt.sel::after{content:"✓";position:absolute;right:2px;top:14px;color:var(--accent);font-weight:800;font-size:19px;}
  .rep-cwrap{padding:16px 0 4px;border-top:1px solid var(--line);}
  .rep-cwrap .rl{font-size:14px;color:var(--txt-2);font-weight:700;margin-bottom:12px;}
  .rep-crow{display:flex;align-items:center;gap:12px;}
  .rep-prev{flex:1 1 auto;min-width:0;font-size:18px;font-weight:800;}
  .rep-prev b{font-weight:800;}
  .step-btn{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--bg);font-size:26px;font-weight:700;
    color:var(--txt);display:flex;align-items:center;justify-content:center;line-height:1;}
  .step-btn:disabled{color:var(--txt-3);}
  .color-row{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px;}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;}
  .swatch.sel{border-color:var(--txt);}
  .mini-list{border-top:1px solid var(--line);}
  .mini-item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);}
  .mini-item .info{flex:1;} .mini-item .info .t{font-weight:700;font-size:17px;}
  .mini-item .info .d{font-size:13px;color:var(--txt-2);font-weight:600;}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:19px;height:19px;stroke:var(--txt);fill:none;stroke-width:2;}
  .toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--surface);
    padding:12px 22px;border-radius:30px;font-weight:700;font-size:15px;opacity:0;transition:opacity var(--dur) var(--ease-out),transform var(--dur) var(--ease-ios);z-index:80;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .switch{margin-left:auto;width:52px;height:31px;border-radius:20px;background:var(--line-strong);position:relative;transition:background-color var(--dur) var(--ease-out);flex:0 0 auto;}
  .switch.on{background:var(--green);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:left var(--dur) var(--ease-ios);box-shadow:0 1px 3px rgba(0,0,0,.3);}

  /* ---------- toque tátil estilo iOS ---------- */
  .filter-pill,.type-tab,.tab,.fab,.step-btn,.done-toggle,.modal-opt,.modal-cancel,.swatch,.arrow,.icon-btn,
  .save-btn,.del-btn,.xbtn,.cal-badge,.rep-x,.topbar-search{
    transition:transform var(--dur-fast) var(--press),background-color var(--dur-fast) var(--ease-out),
      border-color var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out);}
  .filter-pill:active,.type-tab:active,.tab:active,.step-btn:active,.done-toggle:active,.modal-opt:active,
  .modal-cancel:active,.arrow:active,.icon-btn:active,.save-btn:active,.del-btn:active,.swatch:active,
  .xbtn:active,.cal-badge:active,.rep-x:active{transform:scale(.94);}
  .fab:active{transform:scale(.88);}
  .menu-row,.rowitem,.txrow,.sheet-opt,.rep-head,.rep-opt,.balrow,.subrow,.mini-item{
    transition:background-color var(--dur-fast) var(--ease-out);}
  .menu-row:active,.rowitem:active,.txrow:active,.sheet-opt:active,.rep-head:active,.rep-opt:active,
  .balrow:active,.subrow:active{background:var(--bg);}
  /* entrada suave do conteúdo ao trocar de aba */
  @keyframes contentIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  #content.tab-in{animation:contentIn var(--dur) var(--ease-out);}
  .switch.on::after{left:23px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}

  /* ---------- Login ---------- */
  #authgate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;}
  .login-screen{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    padding:34px 28px calc(var(--safe-bot) + 34px);}
  .login-brand{text-align:center;margin-bottom:26px;}
  .login-logo{width:58px;height:58px;margin:0 auto 20px;gap:4px;}
  .login-brand h1{font-size:32px;font-weight:800;margin:0;letter-spacing:-.5px;}
  .login-brand p{color:var(--txt-2);font-weight:600;margin:8px 0 0;font-size:16px;}
  .login-err{color:var(--saida);font-weight:700;font-size:14px;min-height:20px;text-align:center;padding:8px 0 2px;}
  .login-link{display:block;width:100%;background:none;color:var(--txt-2);font-weight:700;font-size:14px;margin-top:12px;padding:8px;}

  /* ---------- Página do dia ---------- */
  #dayview{display:none;position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #dayview.show{transform:translateX(0);}
  #movview{display:none;position:fixed;inset:0;z-index:52;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #movview.show{transform:translateX(0);}
  #tagview{display:none;position:fixed;inset:0;z-index:52;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #tagview.show{transform:translateX(0);}
  .tagview-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .tagview-head .tvname{font-size:22px;font-weight:800;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tagview-head .tvtot{margin-left:auto;font-size:22px;font-weight:800;white-space:nowrap;}
  .day-screen{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--surface);}
  .day-screen .topbar{border-bottom:1px solid var(--line);}
  .arrow.dv-plain{color:var(--txt);width:34px;}
  .arrow.dv-plain svg{width:25px;height:25px;stroke-width:2.7;}
  #dvBack{font-size:26px;}
  .txrow{display:flex;align-items:center;gap:14px;padding:20px 20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .txrow .txinfo{flex:1;min-width:0;}
  .txrow .txt{font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px;}
  .txrow .txd{font-size:16px;color:var(--txt-2);font-weight:600;margin-top:3px;}
  .txrow .txright{text-align:right;flex:0 0 auto;padding-left:8px;}
  .txrow .txval{font-size:21px;font-weight:800;white-space:nowrap;}
  .txrow .txlbl{font-size:16px;color:var(--txt-2);font-weight:600;margin-top:3px;}

  /* ---------- Performance (ano) ---------- */
  #faturaview{display:none;position:fixed;inset:0;z-index:56;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #faturaview.show{transform:translateX(0);}
  #perfview,#cardview{display:none;position:fixed;inset:0;z-index:55;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #perfview.show,#cardview.show{transform:translateX(0);}
  #cardview{display:none;}
  .perf-screen{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--bg);}
  .perf-screen .topbar{background:var(--surface);border-bottom:1px solid var(--line);}
  .perf-year{display:flex;align-items:center;justify-content:center;gap:6px;margin:16px 18px 2px;
    border:1px solid var(--line-strong);border-radius:30px;padding:8px 6px;background:var(--surface);}
  .perf-year .yr{font-size:20px;font-weight:800;letter-spacing:-.3px;min-width:96px;text-align:center;}
  .perf-year .arrow{color:var(--txt-2);width:44px;height:36px;display:flex;align-items:center;justify-content:center;}
  .perf-year .arrow svg{width:22px;height:22px;}
  .perf-help{border-bottom:1px solid var(--line);}
  .perf-help .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:18px 20px;color:var(--txt-2);font-size:17px;font-weight:700;}
  .perf-help .hd .cx{transition:transform var(--dur) var(--ease-out);color:var(--txt-3);font-size:14px;}
  .perf-help.open .hd .cx{transform:rotate(180deg);}
  .perf-help .bd{max-height:0;overflow:hidden;transition:max-height var(--dur-slow) var(--ease-ios);}
  .perf-help.open .bd{max-height:360px;}
  .perf-help .bd .inner{padding:0 20px 20px;color:var(--txt-2);font-size:14px;line-height:1.65;font-weight:600;}
  .perf-chart{padding:18px 14px 12px;background:var(--surface);border-bottom:1px solid var(--line);}
  .perf-chart svg{width:100%;height:auto;display:block;overflow:visible;}
  .perf-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:22px 20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .perf-row .pm{font-size:21px;font-weight:800;letter-spacing:-.2px;}
  .perf-row.now .pm::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-left:8px;vertical-align:middle;}
  .perf-row .pv{font-size:21px;font-weight:800;white-space:nowrap;}

  /* ---------- Cartões (ano) ---------- */
  .cardchips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;background:var(--surface);
    border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .cardchips::-webkit-scrollbar{display:none;}
  .cardchip{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:22px;
    border:1px solid var(--line-strong);background:var(--bg);color:var(--txt-2);font-size:15px;font-weight:700;
    letter-spacing:-.2px;transition:background var(--dur) var(--ease-out),color var(--dur) var(--ease-out),border-color var(--dur) var(--ease-out);}
  .cardchip .dot{width:11px;height:11px;border-radius:3px;}
  .cardchip.on{background:var(--txt);color:var(--surface);border-color:var(--txt);}
  .cardblock-head{display:flex;align-items:center;gap:10px;padding:22px 20px 4px;background:var(--surface);}
  .cardblock-head .dot{width:14px;height:14px;border-radius:4px;flex:0 0 auto;}
  .cardblock-head .nm{font-size:21px;font-weight:800;letter-spacing:-.3px;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cardblock-head .tot{font-size:20px;font-weight:800;color:var(--cartao);white-space:nowrap;}
  .cardblock-sub{padding:0 20px 14px;background:var(--surface);color:var(--txt-3);font-size:13px;font-weight:700;
    border-bottom:1px solid var(--line);}

  /* ---------- Economizado (ano) ---------- */
  #ecoview{display:none;position:fixed;inset:0;z-index:55;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #ecoview.show{transform:translateX(0);}
  .eco-screen{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--bg);}
  .eco-screen .topbar{background:var(--surface);border-bottom:1px solid var(--line);}
  .eco-big{font-size:56px;font-weight:800;letter-spacing:-1.5px;line-height:1.02;}
  .eco-block{padding:18px 20px 22px;background:var(--surface);border-bottom:1px solid var(--line);}
  .eco-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
  .eco-head .nm{font-size:21px;font-weight:800;letter-spacing:-.2px;}
  .eco-head .pc{font-size:21px;font-weight:800;}
  .eco-barline{display:flex;align-items:center;gap:10px;}
  .eco-vals{display:flex;justify-content:space-between;gap:12px;margin-top:14px;}
  .eco-vals .col .k{font-size:15px;color:var(--txt-2);font-weight:700;}
  .eco-vals .col .v{font-size:19px;font-weight:800;margin-top:3px;}
  .eco-vals .col.r{text-align:right;}
  .eco-block.eco-now .nm::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-left:8px;vertical-align:middle;}

  /* ---------- Custo de vida (ano) — reaproveita .perf-* e .eco-* ---------- */
  #custoview{display:none;position:fixed;inset:0;z-index:55;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #custoview.show{transform:translateX(0);}

  /* ---------- Diário médio (ano) — reaproveita .perf-* ---------- */
  #mediaview{display:none;position:fixed;inset:0;z-index:55;background:var(--surface);overflow-y:auto;
    transform:translateX(100%);transition:transform var(--dur-slow) var(--ease-ios);will-change:transform;}
  #mediaview.show{transform:translateX(0);}
  .med-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .med-row .pm{font-size:21px;font-weight:800;letter-spacing:-.2px;padding-top:1px;}
  .med-row.now .pm::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--accent);margin-left:8px;vertical-align:middle;}
  .med-r{text-align:right;white-space:nowrap;}
  .med-r .mv{font-size:21px;font-weight:800;}
  .med-r .ms{font-size:15px;color:var(--txt-3);font-weight:700;margin-top:5px;}

  /* ---------- Conexão / carregamento ---------- */
  #netbar{position:fixed;top:0;left:0;right:0;z-index:120;max-width:460px;margin:0 auto;background:var(--saida);color:#fff;
    font-weight:700;font-size:14px;text-align:center;padding:calc(var(--safe-top) + 11px) 16px 11px;
    transform:translateY(-105%);transition:transform .25s;box-shadow:0 2px 10px rgba(0,0,0,.2);}
  #netbar.show{transform:translateY(0);}
  #cloudload{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  #cloudload.show{display:flex;}
  .spinner{width:38px;height:38px;border:3px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ============================================================
     LAYOUT HORIZONTAL — PC & iPad (largura ≥ 820px)
     Reaproveita todos os tokens existentes. Não afeta o mobile.
     ============================================================ */
  #sidebar{display:none;}
  @media (min-width:820px){

<script>
"use strict";
const APP_VERSION="2026-08-27 · busca flutuante v9";
/* =================== Persistência =================== */

let mem=null;
const Store={
  load(){ try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return mem;} },
  save(d){ mem=d; try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){} }
};

/* =================== Firebase =================== */
/* 1) Crie o projeto no console.firebase.google.com
   2) Ative Authentication > Sign-in method > E-mail/senha
   3) Crie o Firestore Database (modo produção) e aplique as regras enviadas
   4) Em "Configurações do projeto" > seus apps (Web), copie o firebaseConfig e cole abaixo */
const firebaseConfig = {
  apiKey: "AIzaSyDLFa0bKF409UnZQ-Ug9o9k6Zdc_Oo1MXs",
  authDomain: "minhas-financas-21f80.firebaseapp.com",
  projectId: "minhas-financas-21f80",
  storageBucket: "minhas-financas-21f80.firebasestorage.app",
  messagingSenderId: "880368654147",
  appId: "1:880368654147:web:75a18593872d9a570901f6"
};
const FB_ON = (typeof firebase!=="undefined") && firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("COLE_");
let auth=null, db=null, authUid=null, authEmail=null, cloudReady=false, unsub=null, writeTimer=null;

/* =================== Utilidades =================== */
const MN=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MN_FULL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* Setas de navegação em SVG: o traço é controlado por CSS (stroke-width),
   então ficam bem mais grossas e legíveis que os glifos ‹ › ← . */
const navSVG=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const IC_PREV=navSVG("M15 4l-8 8 8 8");
const IC_NEXT=navSVG("M9 4l8 8-8 8");
const IC_BACK=navSVG("M20 12H4M11 5l-7 7 7 7");
/* escapa texto do usuário antes de interpolar em HTML (nomes de tag/cartão, descrições) */
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const brl=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n||0);
const pad=n=>String(n).padStart(2,"0");
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const dstr=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function parseAmount(s){
  if(typeof s==="number")return s;
  s=(s||"").toString().trim().replace(/[^\d.,-]/g,"");
  if(s.includes(",")){ s=s.replace(/\./g,"").replace(",","."); }
  const n=parseFloat(s); return isNaN(n)?0:n;
}
// Máscara de digitação "banco": conta os dígitos como centavos e insere vírgula/pontos sozinho.
function centsMask(v){
  const digits=(v||"").toString().replace(/\D/g,"").slice(0,13);
  if(digits==="")return "";
  const cents=parseInt(digits,10);
  const inteiro=Math.floor(cents/100), c=cents%100;
  return inteiro.toLocaleString("pt-BR")+","+String(c).padStart(2,"0");
}
const amountMask=n=>centsMask(String(Math.round((n||0)*100)));
const TYPES={
  entrada:{label:"entradas",cls:"entrada",glyph:"in"},
  saida:{label:"saídas",cls:"saida",glyph:"out"},
  diario:{label:"diários",cls:"diario",glyph:"D"},
  economia:{label:"economias",cls:"economia",glyph:"E"},
  cartao:{label:"gastos com cartão",cls:"cartao",glyph:"C"},
  previsao:{label:"previsão de diário",cls:"previsao",glyph:"D"}
};
const TYPE_ORDER=["entrada","saida","diario","economia","cartao"];
const SALDO_ORDER=["todas","entradas","saidas","diarios","economias","cartao"];
const FILTER_LABEL={todas:"todas",entradas:"entradas",saidas:"saídas",diarios:"diários",economias:"economias",cartao:"cartão"};
const SWIPE_ORDER=["todas","entradas","saidas","diarios","economias","cartao"];
let saldosScrollY=0;
const TAG_COLORS=["#e9df7f","#a9cce3","#c7b6e8","#d9d9d9","#a7e0a7","#7fd68a","#f5c396","#f2a7c0","#8fd0d6","#f7b7b7"];

function badgeSVG(glyph){
  if(glyph==="in")return `<svg viewBox="0 0 24 24" fill="none"><path d="M17 7L7 17M7 17H15M7 17V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  if(glyph==="out")return `<svg viewBox="0 0 24 24" fill="none"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return glyph;
}
function badge(type,extra=""){
  const t=TYPES[type];
  return `<span class="badge ${t.cls} ${extra}">${badgeSVG(t.glyph)}</span>`;
}

/* =================== Estado inicial (exemplo) =================== */
function seed(){
  const now=new Date();
  const y=now.getFullYear(), m=now.getMonth();
  const cards=[
    {id:uid(),name:"Inter",close:18,due:25},
    {id:uid(),name:"Mercado Pago",close:11,due:16},
    {id:uid(),name:"Santander Elite",close:3,due:9},
  ];
  const tags=[
    {id:uid(),name:"Carro",color:"#e9df7f"},
    {id:uid(),name:"Financiamento Apartamento",color:"#a9cce3"},
    {id:uid(),name:"Lanches",color:"#c7b6e8"},
    {id:uid(),name:"Mercado",color:"#d9d9d9"},
    {id:uid(),name:"Salário Condomínio",color:"#a7e0a7"},
    {id:uid(),name:"Salário Drogasil",color:"#7fd68a"},
  ];
  const tx=[
    {id:uid(),date:dstr(y,m,15),type:"entrada",amount:1779.47,desc:"Salário Condomínio",tag:"Salário Condomínio"},
    {id:uid(),date:dstr(y,m,15),type:"entrada",amount:4807.29,desc:"Salário Drogasil",tag:"Salário Drogasil"},
    {id:uid(),date:dstr(y,m,4),type:"saida",amount:200.00,desc:"Manutenção do carro",tag:"Carro"},
    {id:uid(),date:dstr(y,m,20),type:"saida",amount:400.00,desc:"Plano de saúde",tag:""},
    {id:uid(),date:dstr(y,m,16),type:"saida",amount:303.06,desc:"Mercado",tag:"Mercado"},
    {id:uid(),date:dstr(y,m,5),type:"diario",amount:34.50,desc:"Lanche",tag:"Lanches"},
    {id:uid(),date:dstr(y,m,16),type:"diario",amount:52.16,desc:"Padaria",tag:"Lanches"},
    // gastos de cartão já pesam no saldo no vencimento da fatura:
    // NÃO lance a fatura também como saída, senão o valor conta duas vezes.
    {id:uid(),date:dstr(y,m,16),type:"cartao",amount:670.08,desc:"Compras",tag:"Mercado",card:"Inter",fatura:faturaKey(y,m)},
    {id:uid(),date:dstr(y,m,9),type:"cartao",amount:250.00,desc:"Delivery",tag:"Lanches",card:"Santander Elite",fatura:faturaKey(m===11?y+1:y,(m+1)%12)},
  ];
  return {tx,cards,tags,settings:{initial:0,forecast:0,theme:"light"}};
}

// Com Firebase: começa vazio e só carrega da nuvem (nada de cache local).
// Sem Firebase (sem credenciais): modo local com localStorage.
let state = FB_ON ? {tx:[],cards:[],tags:[],settings:{initial:0,forecast:0,theme:"light"}} : (Store.load()||seed());

/* Normaliza o estado e migra dados de versões antigas.
   Idempotente: roda em qualquer carga (local, importação, nuvem). */
let cutoffNovo=false;
function normalizeState(st){
  if(!st||typeof st!=="object") return st;
  if(!Array.isArray(st.tx)) st.tx=[];
  if(!Array.isArray(st.cards)) st.cards=[];
  if(!Array.isArray(st.tags)) st.tags=[];
  if(!st.settings) st.settings={initial:0,forecast:0,theme:"light"};
  if(typeof st.settings.initial!=="number") st.settings.initial=0;
  if(typeof st.settings.forecast!=="number") st.settings.forecast=0;
  if(typeof st.settings.diarioForecast!=="number") st.settings.diarioForecast=0;
  // Corte do controle de pagamentos: fixado no dia em que o app rodou pela primeira
  // vez com esta versão. Fica gravado — não pode ser recalculado a cada carga, senão
  // as pendências de ontem virariam "pagas" sozinhas.
  if(!/^\d{4}-\d{2}-\d{2}$/.test(st.settings.pagoCutoff||"")){
    const n=new Date();
    st.settings.pagoCutoff=`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`;
    cutoffNovo=true;                    // precisa ser gravado, senão recalcula amanhã
  }
  if(!st.done||typeof st.done!=="object") st.done={};
  // parcelas antigas foram gravadas como recur:true — reclassifica pelo sufixo "(k/n)"
  st.tx.forEach(t=>{
    // "pago" é tri-estado: true, false, ou ausente (decidido pela data)
    if(t.pago!==true && t.pago!==false) delete t.pago;
    if(!t.kind && t.series && t.recur && /\(\d+\/\d+\)\s*$/.test(t.desc||"")){
      t.kind="parcela"; delete t.recur;   // legado: só o cartão numerava antes
    }
  });
  return st;
}
normalizeState(state);

function persist(){
  if(!FB_ON){ Store.save(state); return; }                 // modo local
  if(!(authUid && cloudReady && cloudRef)) return;           // ainda não sincronizou com a nuvem
  if(!navigator.onLine) connSet(true);                       // avisa que está offline
  clearTimeout(writeTimer);
  writeTimer=setTimeout(()=>{
    cloudRef.set(state)
      .then(()=>connSet(false))
      .catch(()=>connSet(true));
  },400);
}

/* =================== Navegação de estado =================== */
const view={ tab:"saldos", y:new Date().getFullYear(), m:new Date().getMonth(), filter:"saidas", dayFilter:"todas" };
let dayOpen=null;

/* =================== Cálculos =================== */
const delta=t=>t.type==="entrada"?t.amount:-t.amount;
function sortedTx(){ return [...state.tx].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }

/* ---- Cartões: fatura & impacto no saldo ----
   Um gasto de cartão pesa no saldo no MÊS DA FATURA (não na data da compra),
   caindo no dia do vencimento do cartão. Lançamentos antigos sem "fatura"
   continuam contando pela própria data. */
const CARD_COLORS=["#7a2fe0","#0aa5c9","#e0762f","#2aa858","#d33d8a","#3a6df0","#c9a90a","#8a5a3a","#5a5f6b","#c94b4b"];
function cardBy(name){ return state.cards.find(c=>c.name===name)||null; }
function cardColor(card){
  if(card&&card.color) return card.color;
  const i=state.cards.findIndex(c=>c.id===(card&&card.id));
  return CARD_COLORS[(i>=0?i:0)%CARD_COLORS.length];
}
function clampDay(n){ n=parseInt(n,10); return (n>=1&&n<=31)?n:0; }
function txMonthKey(t){ return (t.type==="cartao"&&t.fatura)?t.fatura:t.date.slice(0,7); }
function txDay(t){
  if(t.type==="cartao"&&t.fatura){
    const y=+t.fatura.slice(0,4), m=+t.fatura.slice(5,7)-1, dim=daysInMonth(y,m);
    const c=cardBy(t.card), due=c?clampDay(c.due):0;
    return Math.min(due||dim,dim);
  }
  return +t.date.slice(8,10);
}
function faturaKey(y,m){ return `${y}-${pad(m+1)}`; }
function faturaLabel(key){ const y=+key.slice(0,4), m=+key.slice(5,7)-1; return `${MN[m]}/${String(y).slice(2)}`; }
/* Data real da compra. Parcelas de cartão têm "date" sintetizado (mês da fatura),
   então a compra original fica guardada em "buyDate". */
function buyDateOf(t){ return (t.type==="cartao"&&t.buyDate)?t.buyDate:t.date; }
/* legenda pequena da linha de movimentação */
function txSubLabel(t){
  const d=buyDateOf(t), dm=`${d.slice(8,10)}/${d.slice(5,7)}`;
  if(t.type==="cartao"&&t.fatura) return `${dm} · ${esc(t.card||"cartão")} · fatura ${faturaLabel(t.fatura)}`;
  return dm;
}
/* parcela x recorrência: parcelas antigas só têm recur:true, então inferimos pelo campo kind */
function isParcela(t){ return t.kind==="parcela"; }
function isRecorrente(t){ return !!t.recur && !isParcela(t); }
function seriesGlyph(t){ return isParcela(t)?'# ':(isRecorrente(t)?'↺ ':''); }
/* fatura padrão de uma compra: se comprou depois do fechamento, cai na próxima */
function defaultFatura(dateStr,cardName){
  let y=+dateStr.slice(0,4), m=+dateStr.slice(5,7)-1, d=+dateStr.slice(8,10);
  const c=cardBy(cardName), close=c?clampDay(c.close):0;
  if(close&&d>close){ m++; if(m>11){m=0;y++;} }
  return faturaKey(y,m);
}
function monthTx(y,m){ const k=faturaKey(y,m); return state.tx.filter(t=>txMonthKey(t)===k); }

/* ---- Previsão de diário ----
   Valor médio que você espera gastar por dia. NÃO é gravado: é calculado na hora,
   como lançamento virtual. Por isso "zera sozinho" — assim que o dia vira passado,
   ou assim que existe um diário real naquele dia, a previsão simplesmente some.
   Vale só para hoje e dias futuros. */
function forecastValue(){ return Math.max(0, +(state.settings&&state.settings.diarioForecast)||0); }
function forecastTx(y,m){
  const v=forecastValue(); if(!v) return [];
  const now=new Date();
  const ty=now.getFullYear(), tm=now.getMonth(), td=now.getDate();
  if(y<ty||(y===ty&&m<tm)) return [];               // mês passado: nada previsto
  const dim=daysInMonth(y,m);
  const first=(y===ty&&m===tm)?td:1;                // no mês corrente começa hoje
  const temDiario={};
  state.tx.forEach(t=>{ if(t.type==="diario") temDiario[t.date]=true; });
  const out=[];
  for(let d=first;d<=dim;d++){
    const ds=dstr(y,m,d);
    if(temDiario[ds]) continue;                     // já houve gasto real: previsão dá lugar a ele
    out.push({id:"fc-"+ds,type:"previsao",amount:v,desc:"previsão de diário",tag:"",date:ds,virtual:true});
  }
  return out;
}
/* lançamentos reais + previsões — usado onde o SALDO importa */
function monthTxAll(y,m){ return monthTx(y,m).concat(forecastTx(y,m)); }

/* ---- Pago x previsto ----
   "Data efetiva" de um lançamento: para cartão é o vencimento da fatura,
   para o resto é a própria data. É por ela que se decide o que já aconteceu. */
function effDate(t){
  const k=txMonthKey(t);
  return `${k}-${pad(txDay(t))}`;
}
function hojeStr(){ const n=new Date(); return dstr(n.getFullYear(),n.getMonth(),n.getDate()); }
/* Data de corte do controle de pagamentos.
   ANTES dela: histórico, tudo conta como pago (não faz sentido cobrar o passado).
   DELA EM DIANTE: nada conta como pago sem marcação — então uma conta que passou
   sem ser marcada continua pendente e vira atrasada, em vez de virar paga sozinha. */
function pagoCutoff(){ return (state.settings&&state.settings.pagoCutoff)||hojeStr(); }
/* t.pago===true força "pago"; t.pago===false força "pendente". */
function isPago(t){
  if(t.type==="previsao") return false;
  if(t.pago===true) return true;
  if(t.pago===false) return false;
  return effDate(t)<pagoCutoff();
}
/* pendente e já vencido */
function isAtrasado(t){ return !isPago(t) && t.type!=="previsao" && effDate(t)<hojeStr(); }
function setPago(t,v){
  // grava só quando difere do que o corte já indicaria, para não encher o documento
  const auto = effDate(t)<pagoCutoff();
  if(v===auto) delete t.pago; else t.pago=v;
}
function monthTotals(y,m){
  const o={entrada:0,saida:0,diario:0,economia:0,cartao:0,previsao:0};
  monthTx(y,m).forEach(t=>o[t.type]+=t.amount);
  return o;
}
function openingBalance(y,m){
  const k=faturaKey(y,m);
  let b=state.settings.initial||0;
  state.tx.forEach(t=>{ if(txMonthKey(t)<k) b+=delta(t); });
  return b;
}
// saldo ao final de cada dia do mês
function dailyBalances(y,m){
  const dim=daysInMonth(y,m);
  const arr=new Array(dim+1).fill(0);
  let b=openingBalance(y,m);
  const byDay={};
  monthTxAll(y,m).forEach(t=>{ const d=txDay(t); (byDay[d]=byDay[d]||[]).push(t); });
  for(let d=1;d<=dim;d++){
    (byDay[d]||[]).forEach(t=>b+=delta(t));
    arr[d]=b;
  }
  return arr;
}

/* cor termômetro do saldo */
function balStyle(bal,maxAbs){
  if(!bal) return "";
  const a=Math.min(1,0.30+0.70*(Math.abs(bal)/(maxAbs||1)));
  const c=bal<0?`rgba(242,107,102,${a})`:`rgba(42,168,88,${a*0.55})`;
  const txt=bal<0?(a>0.6?"#fff":"#5a1a18"):"#14532b";
  return `background:${c};color:${txt};`;
}

/* arrastar para os lados: só a coluna de valores (meio) desliza */
function attachSaldosSwipe(){
  const scroll=document.getElementById("saldosScroll");
  if(!scroll) return;
  let sx=0,sy=0,dx=0,horiz=null,active=false,suppress=false;
  const setOffset=(x,o)=>{ scroll.style.setProperty("--sldx",x); if(o!=null) scroll.style.setProperty("--sldo",String(o)); };
  const settle=()=>{ scroll.classList.add("sliding"); setOffset("0px",1); };
  scroll.addEventListener("click",e=>{ if(suppress){ e.stopPropagation(); e.preventDefault(); } },true);
  scroll.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"&&e.button!==0)return;
    sx=e.clientX; sy=e.clientY; dx=0; horiz=null; active=true; scroll.classList.remove("sliding"); });
  scroll.addEventListener("pointermove",e=>{
    if(!active) return;
    dx=e.clientX-sx; const dy=e.clientY-sy;
    if(horiz===null && (Math.abs(dx)>8||Math.abs(dy)>8)) horiz=Math.abs(dx)>Math.abs(dy)*1.2;
    if(horiz) setOffset(dx+"px", Math.max(.5,1-Math.abs(dx)/460));
  });
  const finish=()=>{
    if(!active) return; active=false;
    if(!horiz) return;
    suppress=true; setTimeout(()=>suppress=false,350);
    const TH=56;
    if(dx<=-TH) return commitSwipe(1,scroll);
    if(dx>=TH) return commitSwipe(-1,scroll);
    settle();
  };
  scroll.addEventListener("pointerup",finish);
  scroll.addEventListener("pointercancel",()=>{ if(active){ active=false; if(horiz) settle(); } });
}
function commitSwipe(dir,scroll){
  let idx=SWIPE_ORDER.indexOf(view.filter);
  if(idx===-1) idx=0;
  const target=SWIPE_ORDER[(idx+dir+SWIPE_ORDER.length)%SWIPE_ORDER.length];
  const sc=scroll.scrollTop;
  scroll.classList.add("sliding");
  scroll.style.setProperty("--sldx", dir>0?"-100%":"100%");
  scroll.style.setProperty("--sldo","0.12");
  view.filter=target;
  setTimeout(()=>{
    renderSaldos();
    const ns=document.getElementById("saldosScroll");
    if(!ns) return;
    ns.scrollTop=sc;
    ns.classList.remove("sliding");
    ns.style.setProperty("--sldx", dir>0?"100%":"-100%");
    ns.style.setProperty("--sldo","0.12");
    requestAnimationFrame(()=>{
      ns.classList.add("sliding");
      ns.style.setProperty("--sldx","0px");
      ns.style.setProperty("--sldo","1");
    });
  },190);
}

function perfChartSVG(vals){
  const W=372,H=178,top=12,botLabels=26,chartH=H-top-botLabels;
  let maxPos=0,maxNeg=0;
  vals.forEach(v=>{ if(v>maxPos)maxPos=v; if(-v>maxNeg)maxNeg=-v; });
  const total=(maxPos+maxNeg)||1;
  const px=chartH/total;
  const zeroY=top+maxPos*px;
  const slotW=W/12, barW=slotW*0.46;
  const now=new Date(), curM=(perfYear===now.getFullYear())?now.getMonth():-1;
  let bars="";
  vals.forEach((v,i)=>{
    const cx=i*slotW+slotW/2, x=cx-barW/2;
    if(v!==0){
      const h=Math.max(2,Math.abs(v)*px);
      const y=v>0?zeroY-h:zeroY;
      const col=v>0?"var(--green)":"var(--saida)";
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${col}" opacity="${i===curM?1:.88}"/>`;
    }
    const lblCol=i===curM?"var(--accent)":"var(--txt-3)";
    const lblWt=i===curM?"800":"700";
    bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="${lblWt}" fill="${lblCol}">${MN[i][0].toUpperCase()}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${zeroLine}${bars}</svg>`;
}

/* gráfico de barras (mesmo padrão da performance), só valores positivos 0..max */
/* gráfico de barras positivas (reaproveitado por economizado e custo de vida) */
function posBarChartSVG(vals,color,curM){
  color=color||"var(--economia)"; if(curM==null)curM=-1;
  const W=372,H=178,top=12,botLabels=26,chartH=H-top-botLabels;
  const max=Math.max(1,...vals);
  const base=top+chartH;
  const slotW=W/12, barW=slotW*0.46;
  let bars="";
  vals.forEach((v,i)=>{
    const cx=i*slotW+slotW/2, x=cx-barW/2;
    if(v>0){
      const h=Math.max(2,v/max*chartH), y=base-h;
      bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${color}" opacity="${i===curM?1:.88}"/>`;
    }
    const lblCol=i===curM?"var(--accent)":"var(--txt-3)";
    const lblWt=i===curM?"800":"700";
    bars+=`<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12" font-weight="${lblWt}" fill="${lblCol}">${MN[i][0].toUpperCase()}</text>`;
  });
  const baseLine=`<line x1="0" y1="${base.toFixed(1)}" x2="${W}" y2="${base.toFixed(1)}" stroke="var(--line-strong)" stroke-width="1"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${baseLine}${bars}</svg>`;
}

/* =================== Movimentações do mês (por tipo) =================== */
let movOpen=false, movFilter="saidas";

function openMov(filterKey){
  movFilter=filterKey||"saidas";

function closeMov(){ if(movOpen) navBack(); }
function movShift(delta){
  if((view.m+=delta)<0){view.m=11;view.y--;} if(view.m>11){view.m=0;view.y++;}
  render(); renderMov();
}
function renderMov(){
  const g=document.getElementById("movview");

      ${badge(t.type)}

      <div class="txright"><div class="txval">${brl(t.amount)}</div><div class="txlbl">${statusLabel(t)}</div></div>

    : `<div class="empty">Nenhuma movimentação em <b>${fLabel}</b> neste mês.<br>Toque em + para adicionar.</div>`;
  g.innerHTML=`<div class="day-screen">
    <div class="topbar">
      <button class="arrow dv-plain" id="mvBack">${IC_BACK}</button>

        <button class="arrow" id="mvPrev">${IC_PREV}</button>

    <div class="scroll">${rows}</div>
  </div>`;
  document.getElementById("mvBack").onclick=closeMov;

  document.getElementById("mvNext").onclick=()=>movShift(1);
  document.getElementById("mvFilter").onclick=()=>openFilterSheet(movFilter,f2=>{ movFilter=f2; view.filter=f2; renderMov(); });
  g.querySelectorAll("[data-tx]").forEach(el=>el.onclick=()=>openTxSheet(el.dataset.tx));
  const _nm=g.querySelector(".scroll"); if(_nm) _nm.scrollTop=_my;

/* =================== Aviso de pendências na abertura =================== */
/* Só contas: saídas e faturas de cartão. Diários e economias ficam de fora
   porque não são compromissos a pagar. */
let alertaMostrado=false;
const ALERTA_TIPOS={saida:1,cartao:1};

function pendenciasHoje(){
  const h=hojeStr();
  return state.tx.filter(t=>ALERTA_TIPOS[t.type] && effDate(t)===h && !isPago(t))
    .sort((a,b)=>b.amount-a.amount);
}
function pendenciasAtrasadas(){
  return state.tx.filter(t=>ALERTA_TIPOS[t.type] && isAtrasado(t))
    .sort((a,b)=>effDate(a).localeCompare(effDate(b)));
}

/* Chamado uma vez por carregamento do app, depois que os dados chegaram. */
function checarPendencias(){
  if(alertaMostrado) return;
  if(!pendenciasHoje().length && !pendenciasAtrasadas().length) return;
  alertaMostrado=true;
  renderAlertaPendencias();
}

function renderAlertaPendencias(){
  const hoje=pendenciasHoje(), atr=pendenciasAtrasadas();
  if(!hoje.length && !atr.length){ fecharAlerta(); return; }
  const m=document.getElementById("modal");
  const tHoje=hoje.reduce((a,t)=>a+t.amount,0);
  const tAtr=atr.reduce((a,t)=>a+t.amount,0);

  const linha=t=>{
    const d=effDate(t);
    return `<div class="al-row" data-pg="${t.id}">
      ${badge(t.type,"sm")}
      <div class="al-info">
        <div class="al-nm">${esc(t.desc||TYPE_WORD[t.type])}</div>
        <div class="al-dt">${d.slice(8,10)}/${d.slice(5,7)}${t.card?" · "+esc(t.card):""}${t.tag?" · "+esc(t.tag):""}</div>
      </div>
      <div class="al-vl">${brl(t.amount)}</div>
      <button class="al-chk" aria-label="marcar como pago" role="checkbox" aria-checked="false">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.6 4.6L19 7.2"/></svg>
      </button>
    </div>`;
  };

  m.innerHTML=`<div class="modal-card al-card">
    <div class="al-head">
      <span class="al-ico">!</span>
      <div>
        <div class="al-tit">contas a pagar</div>
        <div class="al-sub">${atr.length?`${atr.length} atrasada${atr.length>1?"s":""}`:""}${atr.length&&hoje.length?" · ":""}${hoje.length?`${hoje.length} vence${hoje.length>1?"m":""} hoje`:""}</div>
      </div>
    </div>
    <div class="al-list">
      ${atr.length?`<div class="al-sec late">atrasadas · ${brl(tAtr)}</div>${atr.map(linha).join("")}`:""}
      ${hoje.length?`<div class="al-sec">vencem hoje · ${brl(tHoje)}</div>${hoje.map(linha).join("")}`:""}
    </div>
    <div class="al-foot">
      <button class="modal-opt" id="alTudo">marcar todas como pagas</button>
      <button class="modal-cancel" id="alFechar">agora não</button>
    </div>
  </div>`;
  requestAnimationFrame(()=>m.classList.add("open"));

  m.querySelectorAll("[data-pg]").forEach(el=>{
    const chk=el.querySelector(".al-chk");
    chk.onclick=e=>{
      e.stopPropagation();
      if(el.dataset.busy) return;        // ignora toques repetidos durante a animação
      el.dataset.busy="1";
      chk.classList.add("done"); chk.setAttribute("aria-checked","true");
      el.classList.add("done");
      const t=state.tx.find(x=>x.id===el.dataset.pg);
      if(t){ setPago(t,true); persist(); refresh(); }
      // deixa o ✓ ser desenhado antes de recolher a linha
      setTimeout(()=>{
        el.classList.add("gone");
        setTimeout(renderAlertaPendencias,300);   // fecha sozinho se esvaziar
      },430);
    };
    el.onclick=()=>{ if(el.dataset.busy) return; const id=el.dataset.pg; fecharAlerta(); openTxSheet(id); };
  });
  document.getElementById("alTudo").onclick=()=>{
    const btn=document.getElementById("alTudo");
    if(btn.dataset.busy) return;
    btn.dataset.busy="1";
    // marca visualmente todas em cascata antes de fechar
    [...m.querySelectorAll("[data-pg]")].forEach((el,i)=>{
      const c=el.querySelector(".al-chk");
      setTimeout(()=>{ c.classList.add("done"); c.setAttribute("aria-checked","true");
        el.classList.add("done"); }, i*55);
    });
    [...atr,...hoje].forEach(t=>setPago(t,true));
    persist(); refresh();
    const espera=Math.min(700, atr.length+hoje.length ? (atr.length+hoje.length-1)*55+420 : 0);
    setTimeout(()=>{ fecharAlerta(); toast("Contas marcadas como pagas"); },espera);
  };
  document.getElementById("alFechar").onclick=fecharAlerta;
  m.onclick=e=>{ if(e.target===m) fecharAlerta(); };
}

function fecharAlerta(){
  const m=document.getElementById("modal");
  m.classList.remove("open"); m.onclick=null;
  setTimeout(()=>{ if(!m.classList.contains("open")) m.innerHTML=""; },var_dur());
}

/* =================== Fatura =================== */
let faturaOpen=false, faturaCard=null, faturaKeyCur=null;

/* Itens de uma fatura: todos os gastos daquele cartão com aquela chave de fatura. */
function faturaItems(cardName,key){
  return state.tx.filter(t=>t.type==="cartao"&&t.card===cardName&&txMonthKey(t)===key)
    .sort((a,b)=>buyDateOf(a).localeCompare(buyDateOf(b)));
}
/* Situação da fatura em relação a hoje:
   aberta   -> ainda recebe compras (não passou do fechamento)
   fechada  -> fechou, aguarda pagamento
   paga     -> todos os itens marcados como pagos */
function faturaStatus(card,key){
  const itens=faturaItems(card.name,key);
  if(itens.length && itens.every(isPago)) return "paga";
  const y=+key.slice(0,4), m=+key.slice(5,7)-1;
  const close=clampDay(card.close);
  // a fatura de mês M fecha no dia `close` do mês ANTERIOR (é quando para de receber compras)
  let cy=y, cm=m-1; if(cm<0){ cm=11; cy--; }
  const fechamento=dstr(cy,cm,Math.min(close,daysInMonth(cy,cm)));
  return hojeStr()<=fechamento ? "aberta" : "fechada";
}
function faturaVenc(card,key){
  const y=+key.slice(0,4), m=+key.slice(5,7)-1, d=clampDay(card.due);
  return dstr(y,m,Math.min(d,daysInMonth(y,m)));
}

function openFatura(cardId,key){
  const c=state.cards.find(x=>x.id===cardId); if(!c) return;
  faturaCard=cardId; faturaKeyCur=key; faturaOpen=true; renderFatura();
  navPush(()=>{ faturaOpen=false; const g=document.getElementById("faturaview");
    g.classList.remove("show");
    setTimeout(()=>{ if(!faturaOpen){ g.style.display="none"; g.innerHTML=""; } },460); });
}
function closeFatura(){ if(faturaOpen) navBack(); }
function faturaShift(delta){
  let y=+faturaKeyCur.slice(0,4), m=+faturaKeyCur.slice(5,7)-1+delta;
  y+=Math.floor(m/12); m=((m%12)+12)%12;
  faturaKeyCur=faturaKey(y,m); renderFatura();
}

  g.innerHTML=`<div class="search-screen">

    </div>

let searchOpen=false, searchQ="", searchType="todas", searchStatus="todos";

function openSearch(){
  searchOpen=true; renderSearch();

    g.classList.remove("show");

}
function closeSearch(){ if(searchOpen) navBack(); }

/* Busca em descrição, tag, cartão e valor. Vale para todos os meses. */
function searchResults(){
  const q=(searchQ||"").trim().toLowerCase();
  if(!q && searchType==="todas" && searchStatus==="todos") return [];
  const termos=q.split(/\s+/).filter(Boolean);
  // "129,90" ou "129.90" -> casa com o valor exato; senão cai no texto
  const alvo=q?parseAmount(q):0;
  const buscaValor=!!q && /^[\d.,]+$/.test(q) && alvo>0;

  return state.tx.filter(t=>{
    if(searchType!=="todas" && t.type!==searchType) return false;
    if(searchStatus==="pagos" && !isPago(t)) return false;
    if(searchStatus==="pendentes" && isPago(t)) return false;
    if(searchStatus==="atrasados" && !isAtrasado(t)) return false;
    if(!q) return true;
    if(buscaValor && Math.abs(t.amount-alvo)<0.005) return true;
    const hay=[t.desc||"",t.tag||"",t.card||"",TYPE_WORD[t.type]||""].join(" ").toLowerCase();
    return termos.every(w=>hay.includes(w));   // todos os termos precisam bater
  }).sort((a,b)=>b.date.localeCompare(a.date));
}

function renderSearch(){
  const g=document.getElementById("searchview");
  const _ps=g.querySelector(".sq-results"); const _sy=_ps?_ps.scrollTop:0;
  g.style.display="block";
  const res=searchResults();
  const temFiltro=!!(searchQ||"").trim()||searchType!=="todas"||searchStatus!=="todos";
  const tot=res.reduce((s,t)=>s+(t.type==="entrada"?t.amount:-t.amount),0);

  // agrupa por mês para dar contexto temporal
  let rows="";

  res.slice(0,400).forEach(t=>{
    const k=txMonthKey(t);

    rows+=`<div class="txrow ${isPago(t)?'':'pend'}" data-tx="${t.id}">

  const vazio = !temFiltro
    ? `<div class="empty">Busque por descrição, tag, cartão ou valor.<br>A busca cobre <b>todos os meses</b>.</div>`
    : `<div class="empty">Nada encontrado.<br>Tente outro termo ou limpe os filtros.</div>`;

  const chip=(k,lbl,cur,attr)=>`<button class="sq-chip ${k===cur?'sel':''}" ${attr}="${k}">${lbl}</button>`;

  g.innerHTML=`<div class="sq-panel">
    <div class="sq-top">
      <div class="sq-box">
        <span class="sq-ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg></span>
        <input id="sqInput" type="search" placeholder="descrição, tag, cartão ou valor" value="${esc(searchQ)}" autocomplete="off">
        ${searchQ?`<button class="sq-clear" id="sqClear">✕</button>`:""}
      </div>
      <button class="sq-close" id="sqBack">fechar</button>
    </div>
    <div class="sq-chips">
      ${chip("todas","tudo",searchType,"data-st")}
      ${TYPE_ORDER.map(tp=>chip(tp,TYPE_WORD[tp],searchType,"data-st")).join("")}
    </div>
    <div class="sq-chips">
      ${chip("todos","qualquer status",searchStatus,"data-ss")}
      ${chip("pagos","pagos",searchStatus,"data-ss")}
      ${chip("pendentes","pendentes",searchStatus,"data-ss")}
      ${chip("atrasados","atrasados",searchStatus,"data-ss")}
    </div>
    ${temFiltro?`<div class="sq-sum"><span>${res.length} ${res.length===1?"resultado":"resultados"}</span>
      <span style="color:${tot<0?'var(--saida)':'var(--green)'}">${brl(tot)}</span></div>`:""}
    <div class="sq-results">${res.length?rows:vazio}</div>
  </div>`;

  document.getElementById("sqBack").onclick=closeSearch;
  g.onclick=e=>{ if(e.target===g) closeSearch(); };   // toque fora fecha
  const inp=document.getElementById("sqInput");
  inp.oninput=()=>{ searchQ=inp.value; const p=inp.selectionStart; renderSearch();

  const cl=document.getElementById("sqClear");
  if(cl)cl.onclick=()=>{ searchQ=""; renderSearch(); document.getElementById("sqInput").focus(); };
  g.querySelectorAll("[data-st]").forEach(el=>el.onclick=()=>{ searchType=el.dataset.st; renderSearch(); });
  g.querySelectorAll("[data-ss]").forEach(el=>el.onclick=()=>{ searchStatus=el.dataset.ss; renderSearch(); });
  g.querySelectorAll("[data-tx]").forEach(el=>el.onclick=()=>openTxSheet(el.dataset.tx));
  const _ns=g.querySelector(".sq-results"); if(_ns) _ns.scrollTop=_sy;
  requestAnimationFrame(()=>g.classList.add("show"));
}
