    --txt-2:#8a8a90;
    --txt-3:#b6b6bc;
    --accent:#e5601f;      /* laranja ativo */
    --coral:#f26b66;       /* saldo negativo */
    --green:#2aa858;       /* entradas / saldo positivo */
    --entrada:#26a65a;
    --saida:#c1481c;
    --diario:#e5228e;
    --economia:#8fbf1f;
    --cartao:#7a2fe0;
    --done:#37b24d;        /* dia concluído */
    --shadow:0 1px 3px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05);
    --radius:20px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  [data-theme="dark"]{
    --bg:#000000;
    --surface:#1c1c1e;
    --surface-2:#161618;
    --line:#2a2a2d;
    --line-strong:#333338;
    --txt:#f5f5f7;
    --txt-2:#98989f;
    --txt-3:#5a5a60;
    --coral:#e15a55;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg);color:var(--txt);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overscroll-behavior-y:none;
  }
  #app{max-width:460px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select{font-family:inherit;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;background:var(--surface);
    padding:calc(var(--safe-top) + 14px) 18px 12px;
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .cal-badge{width:44px;height:44px;border-radius:12px;background:var(--surface);
    border:1px solid var(--line-strong);position:relative;display:flex;align-items:flex-end;
    justify-content:center;padding-bottom:5px;font-weight:800;font-size:18px;overflow:hidden;flex:0 0 auto;}
  .cal-badge::before{content:"";position:absolute;top:0;left:0;right:0;height:11px;background:var(--accent);}
  .cal-badge::after{content:"";position:absolute;top:2px;left:9px;width:4px;height:6px;border-radius:2px;
    background:var(--txt);box-shadow:18px 0 0 var(--txt);}
  .month-nav{display:flex;align-items:center;gap:14px;}
  .month-nav .arrow{font-size:26px;color:var(--txt-3);width:30px;height:30px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .month-label{font-size:27px;font-weight:800;letter-spacing:-.5px;min-width:118px;text-align:center;}
  .grid-icon{width:34px;height:34px;flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);gap:2px;}
  .grid-icon span{background:var(--coral);border-radius:2px;}

  /* ---------- Filter bar (saldos) ---------- */
  .subbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px;
    color:var(--txt-2);font-size:16px;}
  .filter-pill{display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid var(--line-strong);
    border-radius:30px;background:var(--surface);font-weight:800;color:var(--txt);font-size:17px;}
  .filter-pill .chev{color:var(--txt-3);font-size:13px;}
  .badge{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:13px;flex:0 0 auto;}
  .badge svg{width:15px;height:15px;}
  .badge.entrada{background:var(--entrada);} .badge.saida{background:var(--saida);}
  .badge.diario{background:var(--diario);} .badge.economia{background:var(--economia);}
  .badge.cartao{background:var(--cartao);} .badge.todas{background:var(--txt-2);}
  .badge.muted{background:#d2d2d8;} [data-theme="dark"] .badge.muted{background:#3a3a3d;}

  /* ---------- Content ---------- */
  .screen{padding-bottom:120px;}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;}

  /* saldos rows */
  .balrow{display:grid;grid-template-columns:46px 1fr 150px;align-items:stretch;border-bottom:1px solid var(--line);
    background:var(--surface);min-height:64px;position:relative;}
  .balrow .day{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:var(--txt);position:relative;}
  .balrow .day.today{background:var(--txt);color:#fff;}
  .balrow.has .day::before{content:"";position:absolute;top:0;left:0;border-style:solid;border-width:16px 16px 0 0;
    border-color:var(--economia) transparent transparent transparent;}
  .balrow .amt{display:flex;align-items:center;gap:12px;padding:0 6px 0 4px;font-size:20px;font-weight:600;}
  .balrow .amt .val{margin-left:auto;text-align:right;}
  .balrow .amt.zero{color:var(--txt-3);} .balrow .amt.zero .badge{background:#d2d2d8;}
  [data-theme="dark"] .balrow .amt.zero .badge{background:#3a3a3d;}
  .balrow .bal{display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-size:19px;font-weight:600;
    border-left:1px solid var(--line);}

  /* todas grouped */
  .dayblock{border-bottom:1px solid var(--line-strong);}
  .subrow{display:grid;grid-template-columns:46px 1fr 150px;align-items:center;min-height:52px;background:var(--surface);
    border-top:1px solid var(--line);}
  .subrow:first-child{border-top:none;}
  .subrow .lead{display:flex;align-items:center;justify-content:center;position:relative;align-self:stretch;}
  .subrow .lead .n{font-size:19px;font-weight:600;}
  .subrow.has .lead::before{content:"";position:absolute;top:0;left:0;border-style:solid;border-width:16px 16px 0 0;
    border-color:var(--economia) transparent transparent transparent;}
  .subrow .amt{display:flex;align-items:center;gap:12px;padding:0 6px 0 4px;font-size:19px;font-weight:600;}
  .subrow .amt .val{margin-left:auto;}
  .subrow .amt.zero{color:var(--txt-3);}
  .subrow .bal{align-self:stretch;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;font-weight:700;font-size:18px;}

  /* dia concluído (marcação manual) */
  .balrow .day[data-done],.subrow .lead[data-done]{cursor:pointer;}
  .balrow.done .day::before,.dayblock.done .subrow:first-child .lead::before{
    border-color:var(--done) transparent transparent transparent;}
  .balrow.done .day::after,.dayblock.done .subrow:first-child .lead::after{
    content:"✓";position:absolute;top:-2px;left:1px;font-size:11px;line-height:1;font-weight:900;color:#fff;}
  .done-toggle{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-radius:14px;
    background:var(--surface-2);border:1px solid var(--line-strong);color:var(--txt);font-size:16px;font-weight:700;}
  .done-toggle .dt-box{width:24px;height:24px;flex:0 0 auto;border-radius:7px;border:2px solid var(--txt-3);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff;font-weight:900;}
  .done-toggle.on{border-color:var(--done);color:var(--done);}
  .done-toggle.on .dt-box{background:var(--done);border-color:var(--done);}

  /* modal de escolha (repetidas) */
  #modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:26px;
    background:rgba(0,0,0,.42);}
  #modal.open{display:flex;}
  .modal-card{width:100%;max-width:400px;background:var(--surface);border-radius:26px;padding:26px 22px 18px;box-shadow:var(--shadow);}
  .modal-title{font-size:25px;font-weight:800;margin-bottom:20px;color:var(--txt);}
  .modal-opt{display:block;width:100%;padding:16px;border-radius:30px;border:1.5px solid var(--line-strong);
    background:var(--surface);color:var(--txt);font-size:17px;font-weight:800;margin-bottom:14px;}
  .modal-opt.danger{color:var(--saida);border-color:var(--saida);}
  .modal-cancel{display:block;width:100%;padding:12px;background:none;color:var(--txt-2);font-size:17px;font-weight:800;}

  /* ---------- Cards / lists (totais, tags, menu) ---------- */
  .section-title{padding:22px 20px 8px;color:var(--txt-2);font-size:16px;font-weight:700;}
  .card{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .rowitem{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .rowitem:last-child{border-bottom:none;}
  .rowitem .label{font-size:20px;font-weight:700;}
  .rowitem .value{margin-left:auto;font-size:20px;font-weight:700;text-align:right;}
  .rowitem .sub{font-size:14px;color:var(--txt-2);font-weight:600;}

  .calc{padding:20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .calc .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
  .calc .name{font-size:23px;font-weight:800;}
  .calc .big{font-size:23px;font-weight:800;text-align:right;}
  .calc .cap{font-size:15px;color:var(--txt-2);text-align:right;margin-top:2px;font-weight:600;}
  .chips{display:flex;align-items:center;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .chips .op{color:var(--txt-3);font-weight:800;font-size:17px;}
  .badge.sm{width:24px;height:24px;font-size:12px;}
  .badge.sm svg{width:13px;height:13px;}
  .badge.ring{background:var(--surface);border:2px dashed var(--diario);color:var(--diario);}
  .bar{height:26px;border:2px solid var(--economia);border-radius:20px;flex:1;overflow:hidden;position:relative;background:transparent;}
  .bar > i{position:absolute;left:0;top:0;bottom:0;background:var(--economia);border-radius:20px;}

  /* tag color dot */
  .tagdot{width:22px;height:30px;border-radius:5px;flex:0 0 auto;position:relative;}
  .tagdot::after{content:"";position:absolute;right:-7px;top:0;border-style:solid;border-width:15px 0 15px 8px;border-color:transparent;}

  /* menu */
  .menu-row{display:flex;align-items:center;gap:14px;padding:17px 20px;border-bottom:1px solid var(--line);background:var(--surface);font-size:18px;font-weight:600;}
  .menu-row .chev{margin-left:auto;color:var(--txt-3);font-size:20px;}
  .menu-ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--bg);flex:0 0 auto;}
  .menu-ic svg{width:18px;height:18px;stroke:var(--txt);}

  .empty{text-align:center;color:var(--txt-2);padding:70px 30px;font-size:17px;line-height:1.5;}
  .empty b{color:var(--txt);}

  /* ---------- Bottom tab bar ---------- */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--surface);border-top:1px solid var(--line);
    max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;
    padding:8px 6px calc(var(--safe-bot) + 8px);}
  .tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--txt-2);font-size:13px;font-weight:700;padding:4px 0;}
  .tab svg{width:24px;height:24px;stroke:var(--txt-2);fill:none;stroke-width:2;}
  .tab.active{color:var(--accent);}
  .tab.active svg{stroke:var(--accent);}
  .tab.active::before{content:"";position:absolute;top:0;width:46px;height:3px;border-radius:3px;background:var(--accent);}
  .tab{position:relative;}
  .fab-wrap{display:flex;justify-content:center;align-items:flex-start;}
  .fab{width:62px;height:62px;border-radius:50%;background:var(--txt);color:var(--surface);display:flex;
    align-items:center;justify-content:center;margin-top:-22px;box-shadow:0 6px 18px rgba(0,0,0,.25);}
  .fab svg{width:30px;height:30px;stroke:var(--surface);stroke-width:2.4;}

  /* ---------- Sheet / modal ---------- */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;
    display:flex;align-items:flex-end;justify-content:center;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:460px;background:var(--surface);border-radius:26px 26px 0 0;transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);max-height:92dvh;overflow-y:auto;padding-bottom:calc(var(--safe-bot) + 20px);}
  .backdrop.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:22px 22px 6px;}
  .sheet-head h2{margin:0;font-size:27px;font-weight:800;}
  .xbtn{width:34px;height:34px;font-size:26px;color:var(--txt-2);display:flex;align-items:center;justify-content:center;}
  .sheet-opt{display:flex;align-items:center;gap:16px;padding:20px 22px;border-top:1px solid var(--line);font-size:20px;font-weight:700;}

  /* add form */
  .form{padding:6px 22px 0;}
  .type-tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0 14px;scrollbar-width:none;}
  .type-tabs::-webkit-scrollbar{display:none;}
  .type-tab{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:30px;background:var(--bg);
    font-weight:700;font-size:15px;color:var(--txt-2);border:2px solid transparent;}
  .type-tab.sel{color:var(--txt);border-color:var(--txt);background:var(--surface);}
  .amount-box{text-align:center;padding:14px 0 8px;}
  .amount-box .cur{font-size:20px;color:var(--txt-2);font-weight:700;}
  .amount-box input{border:none;background:none;font-size:48px;font-weight:800;text-align:center;width:100%;color:var(--txt);outline:none;letter-spacing:-1px;}
  .field{padding:14px 0;border-top:1px solid var(--line);}
  .field label{display:block;font-size:14px;color:var(--txt-2);font-weight:700;margin-bottom:7px;}
  .field input[type=text],.field input[type=date],.field select{width:100%;font-size:18px;font-weight:600;padding:12px 14px;
    border:1px solid var(--line-strong);border-radius:14px;background:var(--surface-2);color:var(--txt);outline:none;}
  .field.hidden{display:none;}
  .save-btn{width:100%;padding:17px;border-radius:16px;background:var(--accent);color:#fff;font-size:19px;font-weight:800;margin:16px 0 6px;}
  .del-btn{width:100%;padding:15px;border-radius:16px;background:transparent;color:var(--saida);font-size:17px;font-weight:800;}
  /* repetir */
  .rep-head{display:flex;align-items:center;gap:14px;padding:16px 0;border-top:1px solid var(--line);font-size:18px;font-weight:700;cursor:pointer;}
  .rep-head .rep-ic{width:26px;height:26px;flex:0 0 auto;}
  .rep-head .rep-ic svg{width:24px;height:24px;stroke:var(--txt);fill:none;stroke-width:2;}
  .rep-head .rep-name{flex:1 1 auto;min-width:0;}
  .rep-head .chev{color:var(--txt-3);font-size:16px;}
  .rep-head .rep-x{width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--txt-2);font-size:20px;font-weight:700;background:var(--bg);}
  .rep-opts{border-top:1px solid var(--line);}
  .rep-opt{padding:14px 0 14px 40px;border-top:1px solid var(--line);cursor:pointer;position:relative;}
  .rep-opt:first-child{border-top:none;}
  .rep-opt .t{font-size:17px;font-weight:800;}
  .rep-opt .d{font-size:13px;color:var(--txt-2);font-weight:600;margin-top:3px;}
  .rep-opt.sel .t{color:var(--accent);}
  .rep-opt.sel::after{content:"✓";position:absolute;right:2px;top:14px;color:var(--accent);font-weight:800;font-size:19px;}
  .rep-cwrap{padding:16px 0 4px;border-top:1px solid var(--line);}
  .rep-cwrap .rl{font-size:14px;color:var(--txt-2);font-weight:700;margin-bottom:12px;}
  .rep-crow{display:flex;align-items:center;gap:12px;}
  .rep-prev{flex:1 1 auto;min-width:0;font-size:18px;font-weight:800;}
  .rep-prev b{font-weight:800;}
  .step-btn{width:46px;height:46px;flex:0 0 auto;border-radius:13px;background:var(--bg);font-size:26px;font-weight:700;
    color:var(--txt);display:flex;align-items:center;justify-content:center;line-height:1;}
  .step-btn:disabled{color:var(--txt-3);}
  .color-row{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px;}
  .swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;}
  .swatch.sel{border-color:var(--txt);}
  .mini-list{border-top:1px solid var(--line);}
  .mini-item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);}
  .mini-item .info{flex:1;} .mini-item .info .t{font-weight:700;font-size:17px;}
  .mini-item .info .d{font-size:13px;color:var(--txt-2);font-weight:600;}
  .icon-btn{width:38px;height:38px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;}
  .icon-btn svg{width:19px;height:19px;stroke:var(--txt);fill:none;stroke-width:2;}
  .toast{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--txt);color:var(--surface);
    padding:12px 22px;border-radius:30px;font-weight:700;font-size:15px;opacity:0;transition:.3s;z-index:80;pointer-events:none;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .switch{margin-left:auto;width:52px;height:31px;border-radius:20px;background:var(--line-strong);position:relative;transition:.2s;flex:0 0 auto;}
  .switch.on{background:var(--green);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .switch.on::after{left:23px;}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;}}

  /* ---------- Login ---------- */
  #authgate{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;}
  .login-screen{max-width:460px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
    padding:34px 28px calc(var(--safe-bot) + 34px);}
  .login-brand{text-align:center;margin-bottom:26px;}
  .login-logo{width:58px;height:58px;margin:0 auto 20px;gap:4px;}
  .login-brand h1{font-size:32px;font-weight:800;margin:0;letter-spacing:-.5px;}
  .login-brand p{color:var(--txt-2);font-weight:600;margin:8px 0 0;font-size:16px;}
  .login-err{color:var(--saida);font-weight:700;font-size:14px;min-height:20px;text-align:center;padding:8px 0 2px;}
  .login-link{display:block;width:100%;background:none;color:var(--txt-2);font-weight:700;font-size:14px;margin-top:12px;padding:8px;}

  /* ---------- Página do dia ---------- */
  #dayview{display:none;position:fixed;inset:0;z-index:50;background:var(--surface);overflow-y:auto;}
  .day-screen{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--surface);}
  .day-screen .topbar{border-bottom:1px solid var(--line);}
  .arrow.dv-plain{font-size:28px;color:var(--txt);width:34px;}
  #dvBack{font-size:26px;}
  .txrow{display:flex;align-items:center;gap:14px;padding:20px 20px;border-bottom:1px solid var(--line);background:var(--surface);}
  .txrow .txinfo{flex:1;min-width:0;}
  .txrow .txt{font-size:21px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.2px;}
  .txrow .txd{font-size:16px;color:var(--txt-2);font-weight:600;margin-top:3px;}
  .txrow .txright{text-align:right;flex:0 0 auto;padding-left:8px;}
  .txrow .txval{font-size:21px;font-weight:800;white-space:nowrap;}
  .txrow .txlbl{font-size:16px;color:var(--txt-2);font-weight:600;margin-top:3px;}

  /* ---------- Conexão / carregamento ---------- */
  #netbar{position:fixed;top:0;left:0;right:0;z-index:120;max-width:460px;margin:0 auto;background:var(--saida);color:#fff;
    font-weight:700;font-size:14px;text-align:center;padding:calc(var(--safe-top) + 11px) 16px 11px;
    transform:translateY(-105%);transition:transform .25s;box-shadow:0 2px 10px rgba(0,0,0,.2);}
  #netbar.show{transform:translateY(0);}
  #cloudload{display:none;position:fixed;inset:0;z-index:90;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:16px;}
  #cloudload.show{display:flex;}
  .spinner{width:38px;height:38px;border:3px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="content" class="screen"></div>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="backdrop" id="backdrop"><div class="sheet" id="sheet"></div></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<div id="authgate"></div>
<div id="dayview"></div>
<div id="netbar"></div>
<div id="cloudload"><div class="spinner"></div><div style="font-weight:700;color:var(--txt-2)">Sincronizando…</div></div>

<!-- Firebase (compat) — se não configurar, o app roda em modo local -->

/* =================== Utilidades =================== */
const MN=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const brl=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(n||0);
const pad=n=>String(n).padStart(2,"0");
const daysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
const dstr=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
function parseAmount(s){
  if(typeof s==="number")return s;
  s=(s||"").toString().trim().replace(/[^\d.,-]/g,"");
  if(s.includes(",")){ s=s.replace(/\./g,"").replace(",","."); }
  const n=parseFloat(s); return isNaN(n)?0:n;
}
// Máscara de digitação "banco": conta os dígitos como centavos e insere vírgula/pontos sozinho.
function centsMask(v){
  const digits=(v||"").toString().replace(/\D/g,"").slice(0,13);
  if(digits==="")return "";
  const cents=parseInt(digits,10);
  const inteiro=Math.floor(cents/100), c=cents%100;
  return inteiro.toLocaleString("pt-BR")+","+String(c).padStart(2,"0");
}
const amountMask=n=>centsMask(String(Math.round((n||0)*100)));
const TYPES={
  entrada:{label:"entradas",cls:"entrada",glyph:"in"},
  saida:{label:"saídas",cls:"saida",glyph:"out"},

  economia:{label:"economias",cls:"economia",glyph:"E"},

};
const TYPE_ORDER=["entrada","saida","diario","economia","cartao"];
const TAG_COLORS=["#e9df7f","#a9cce3","#c7b6e8","#d9d9d9","#a7e0a7","#7fd68a","#f5c396","#f2a7c0","#8fd0d6","#f7b7b7"];

function badgeSVG(glyph){
  if(glyph==="in")return `<svg viewBox="0 0 24 24" fill="none"><path d="M17 7L7 17M7 17H15M7 17V9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  return glyph;
}
function badge(type,extra=""){
  const t=TYPES[type];
  return `<span class="badge ${t.cls} ${extra}">${badgeSVG(t.glyph)}</span>`;
}

// Com Firebase: começa vazio e só carrega da nuvem (nada de cache local).
// Sem Firebase (sem credenciais): modo local com localStorage.
let state = FB_ON ? {tx:[],cards:[],tags:[],settings:{initial:0,forecast:0,theme:"light"}} : (Store.load()||seed());
if(!state.settings)state.settings={initial:0,forecast:0,theme:"light"};
function persist(){
  if(!FB_ON){ Store.save(state); return; }                 // modo local
  if(!(authUid && cloudReady && cloudRef)) return;           // ainda não sincronizou com a nuvem
  if(!navigator.onLine) connSet(true);                       // avisa que está offline
  clearTimeout(writeTimer);
  writeTimer=setTimeout(()=>{
    cloudRef.set(state)
      .then(()=>connSet(false))
      .catch(()=>connSet(true));
  },400);
}

/* =================== Navegação de estado =================== */
const view={ tab:"saldos", y:new Date().getFullYear(), m:new Date().getMonth(), filter:"saidas", dayFilter:"todas" };
let dayOpen=null;

/* =================== Cálculos =================== */
const delta=t=>t.type==="entrada"?t.amount:-t.amount;
function sortedTx(){ return [...state.tx].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); }
function monthTx(y,m){ const k=`${y}-${pad(m+1)}`; return state.tx.filter(t=>t.date.startsWith(k)); }
function monthTotals(y,m){
  const o={entrada:0,saida:0,diario:0,economia:0,cartao:0};
  monthTx(y,m).forEach(t=>o[t.type]+=t.amount);
  return o;
}
function openingBalance(y,m){
  const first=dstr(y,m,1);
  let b=state.settings.initial||0;
  sortedTx().forEach(t=>{ if(t.date<first) b+=delta(t); });
  return b;
}
// saldo ao final de cada dia do mês
function dailyBalances(y,m){
  const dim=daysInMonth(y,m);
  const arr=new Array(dim+1).fill(0);
  let b=openingBalance(y,m);
  const byDay={};
  monthTx(y,m).forEach(t=>{ const d=+t.date.slice(8,10); (byDay[d]=byDay[d]||[]).push(t); });
  for(let d=1;d<=dim;d++){
    (byDay[d]||[]).forEach(t=>b+=delta(t));
    arr[d]=b;
  }
  return arr;
}

/* cor termômetro do saldo */
function balStyle(bal,maxAbs){
  if(!bal) return "";
  const a=Math.min(1,0.30+0.70*(Math.abs(bal)/(maxAbs||1)));
  const c=bal<0?`rgba(242,107,102,${a})`:`rgba(42,168,88,${a*0.55})`;
  const txt=bal<0?(a>0.6?"#fff":"#5a1a18"):"#14532b";
  return `background:${c};color:${txt};`;
}

/* =================== Render: Saldos =================== */
function renderSaldos(){
  const c=document.getElementById("content");
  const dim=daysInMonth(view.y,view.m);
  const bals=dailyBalances(view.y,view.m);
  const maxAbs=Math.max(1,...bals.slice(1).map(Math.abs));
  const today=new Date();
  const isToday=d=>today.getFullYear()===view.y&&today.getMonth()===view.m&&today.getDate()===d;
  const f=view.filter;
  const fLabel=f==="todas"?"todas":TYPES[f==="saidas"?"saida":f==="entradas"?"entrada":f==="diarios"?"diario":f==="economias"?"economia":f==="cartao"?"cartao":"saida"].label;
  const fType=({saidas:"saida",entradas:"entrada",diarios:"diario",economias:"economia",cartao:"cartao"})[f];

  let sub=`<div class="subbar">
    <span style="font-weight:700">dia</span>
    <button class="filter-pill" id="filterBtn">${f==="todas"?'<span class="badge todas" style="background:var(--txt-2)">•••</span>':badge(fType)} ${fLabel} <span class="chev">▾</span></button>
    <span style="font-weight:700">saldos</span>
  </div>`;

  // agrupa transações por dia
  const byDay={};
  monthTx(view.y,view.m).forEach(t=>{ const d=+t.date.slice(8,10); (byDay[d]=byDay[d]||[]).push(t); });

  let rows="";
  if(f==="todas"){
    for(let d=1;d<=dim;d++){
      const ds=dstr(view.y,view.m,d);
      const list=byDay[d]||[];
      const has=list.length>0;
      const sums={}; TYPE_ORDER.forEach(tp=>sums[tp]=0);
      list.forEach(t=>sums[t.type]+=t.amount);
      let inner="";
      TYPE_ORDER.forEach((tp,i)=>{
        const v=sums[tp];const zero=v===0;
        const tItem=list.find(x=>x.type===tp);
        inner+=`<div class="subrow ${i===0&&has?'has':''}" ${tItem?`data-tx="${tItem.id}"`:""}>
          <div class="lead" ${i===0?`data-done="${ds}"`:""}>${i===0?`<span class="n ${isToday(d)?'':''}">${d}</span>`:""}</div>
          <div class="amt ${zero?'zero':''}">${badge(tp,zero?'muted':'')}<span class="val">${brl(v)}</span></div>
          ${i===0?`<div class="bal" style="${balStyle(bals[d],maxAbs)}">${brl(bals[d])}</div>`:`<div class="bal" style="${balStyle(bals[d],maxAbs)};border:none"></div>`}
        </div>`;
      });
      rows+=`<div class="dayblock ${doneMap()[ds]?'done':''}" data-day="${d}">${inner}</div>`;
    }
  } else {
    for(let d=1;d<=dim;d++){
      const ds=dstr(view.y,view.m,d);
      const list=(byDay[d]||[]).filter(t=>t.type===fType);
      const v=list.reduce((s,t)=>s+t.amount,0);
      const zero=v===0;
      const tItem=list[0];
      rows+=`<div class="balrow ${list.length?'has':''} ${doneMap()[ds]?'done':''}" data-day="${d}">
        <div class="day ${isToday(d)?'today':''}" data-done="${ds}">${d}</div>
        <div class="amt ${zero?'zero':''}">${badge(fType,zero?'muted':'')}<span class="val">${brl(v)}</span></div>
        <div class="bal" style="${balStyle(bals[d],maxAbs)}">${brl(bals[d])}</div>
      </div>`;
    }
  }
  c.innerHTML=sub+`<div class="scroll">${rows}</div>`;
  document.getElementById("filterBtn").onclick=()=>openFilterSheet(view.filter,f2=>{ view.filter=f2; render(); });
  c.querySelectorAll("[data-done]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleDone(el.dataset.done); });
  c.querySelectorAll("[data-day]").forEach(el=>el.onclick=()=>openDay(dstr(view.y,view.m,+el.dataset.day)));
}

/* =================== Render: Totais =================== */
function chip(type){ return badge(type,"sm"); }
function renderTotais(){
  const c=document.getElementById("content");
  const t=monthTotals(view.y,view.m);
  const fc=state.settings.forecast||0;
  const perf=t.entrada-t.saida-t.diario-t.economia-t.cartao-fc;
  const custo=t.saida+t.diario+t.cartao+fc;
  const dim=daysInMonth(view.y,view.m);
  const now=new Date();
  const divDays=(now.getFullYear()===view.y&&now.getMonth()===view.m)?now.getDate():dim;
  const medio=t.diario/divDays;
  const pct=t.entrada>0?(t.economia/t.entrada*100):0;

  const perfCap=perf<0?"faltou dinheiro":perf>0?"sobrou dinheiro":"fechou no zero";
  const perfColor=perf<0?"var(--saida)":perf>0?"var(--green)":"var(--txt-2)";
  const custoCap=custo>t.entrada?"acima da renda":"dentro da renda";

  let html=`<div class="scroll">
    <div class="section-title">cálculos do mês</div>
    <div class="calc">
      <div class="top"><div class="name">performance</div><div><div class="big" style="color:${perfColor}">${brl(perf)}</div><div class="cap">${perfCap}</div></div></div>
      <div class="chips">${chip("entrada")}<span class="op">−</span>${chip("saida")}<span class="op">−</span>${chip("diario")}<span class="op">−</span>${chip("economia")}<span class="op">−</span>${chip("cartao")}<span class="op">−</span><span class="badge sm ring">D</span></div>
    </div>
    <div class="calc">
      <div class="top"><div class="name">economizado</div><div><div class="big">${pct.toFixed(0)}%</div><div class="cap">${pct<=0?"nada guardado":"da renda guardada"}</div></div></div>
      <div class="chips"><span class="badge sm economia">E</span><div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%"></i></div>${chip("entrada")}</div>
    </div>
    <div class="calc">
      <div class="top"><div class="name">custo de vida</div><div><div class="big">${brl(custo)}</div><div class="cap">${custoCap}</div></div></div>
      <div class="chips">${chip("saida")}<span class="op">+</span>${chip("diario")}<span class="op">+</span>${chip("cartao")}<span class="op">+</span><span class="badge sm ring">D</span></div>
    </div>
    <div class="calc">
      <div class="top"><div class="name">diário médio</div><div><div class="big">${brl(medio)}</div><div class="cap"><span class="badge sm ring" style="display:inline-flex;vertical-align:middle;margin-right:4px">D</span>${brl(fc)}</div></div></div>
      <div class="chips"><span class="badge sm diario">D</span><span style="color:var(--txt-2);font-weight:700">/ ${divDays} dias</span></div>
    </div>

    <div class="section-title">movimentações do mês</div>
    <div class="card">
      ${movRow("entrada",t.entrada)}
      ${movRow("saida",t.saida)}
      ${movRow("diario",t.diario)}
      ${movRow("economia",t.economia)}
      ${movRow("cartao",t.cartao)}
    </div>

    <div class="section-title">previsão de diários do mês</div>
    <div class="card">
      <div class="rowitem"><span class="badge sm ring" style="width:28px;height:28px">D</span><span class="label">previsão de diário <span style="color:var(--txt-2)">×1</span></span><span class="value">${brl(fc)}</span></div>
    </div>
    <div style="height:20px"></div>
  </div>`;
  c.innerHTML=html;
  c.querySelectorAll("[data-mov]").forEach(el=>el.onclick=()=>{
    view.filter=el.dataset.mov; switchTab("saldos");
  });
}
function movRow(type,val){
  const f=({entrada:"entradas",saida:"saidas",diario:"diarios",economia:"economias",cartao:"cartao"})[type];
  return `<div class="rowitem" data-mov="${f}">${badge(type)}<span class="label">${TYPES[type].label}</span><span class="value">${brl(val)}</span></div>`;
}

/* =================== Página do dia =================== */
const TYPE_WORD={entrada:"entrada",saida:"saída",diario:"diário",economia:"economia",cartao:"cartão"};
function refresh(){ render(); if(dayOpen) renderDay(); }
function openDay(dateStr){
  dayOpen=dateStr; view.dayFilter="todas"; renderDay();
  navPush(()=>{ dayOpen=null; const g=document.getElementById("dayview"); g.style.display="none"; g.innerHTML=""; });
}
function closeDay(){ if(dayOpen) navBack(); }
function shiftDay(delta){
  const d=new Date(dayOpen+"T12:00:00"); d.setDate(d.getDate()+delta);
  dayOpen=dstr(d.getFullYear(),d.getMonth(),d.getDate());
  view.y=d.getFullYear(); view.m=d.getMonth();
  render(); renderDay();
}
function renderDay(){
  if(!dayOpen)return;
  const g=document.getElementById("dayview"); g.style.display="block";
  const D=+dayOpen.slice(8,10), Mo=dayOpen.slice(5,7);
  const label=`${pad(D)}/${Mo}`;
  const f=view.dayFilter;
  const fType=({saidas:"saida",entradas:"entrada",diarios:"diario",economias:"economia",cartao:"cartao"})[f];
  let list=state.tx.filter(t=>t.date===dayOpen);
  if(f!=="todas") list=list.filter(t=>t.type===fType);
  list.sort((a,b)=>TYPE_ORDER.indexOf(a.type)-TYPE_ORDER.indexOf(b.type));
  const fLabel=f==="todas"?"todas":TYPES[fType].label;
  const rows=list.length ? list.map(t=>`
    <div class="txrow" data-tx="${t.id}">
      ${badge(t.type)}
      <div class="txinfo"><div class="txt">${(t.desc||TYPE_WORD[t.type]).replace(/</g,'&lt;')}</div><div class="txd">${t.date.slice(8,10)}/${t.date.slice(5,7)}</div></div>
      <div class="txright"><div class="txval">${brl(t.amount)}</div><div class="txlbl">${t.recur?'↺ ':''}${TYPE_WORD[t.type]}</div></div>
    </div>`).join("")
    : `<div class="empty">Nenhuma movimentação neste dia${f!=="todas"?` em <b>${fLabel}</b>`:""}.<br>Toque em + para adicionar.</div>`;
  g.innerHTML=`<div class="day-screen">
    <div class="topbar">
      <button class="arrow dv-plain" id="dvBack">←</button>
      <div class="month-nav">
        <button class="arrow" id="dvPrev">‹</button>
        <div class="month-label" style="font-size:26px;min-width:96px">${label}</div>
        <button class="arrow" id="dvNext">›</button>
      </div>
      <button class="arrow dv-plain" id="dvAdd">+</button>
    </div>
    <div style="padding:14px 18px 6px"><button class="filter-pill" id="dvFilter" style="width:100%;justify-content:flex-start">${f==="todas"?'<span class="badge todas" style="background:var(--txt-2)">•••</span>':badge(fType)} ${fLabel}<span class="chev" style="margin-left:auto">▾</span></button></div>
    <div style="padding:0 18px 8px"><button class="done-toggle ${doneMap()[dayOpen]?'on':''}" id="dvDone"><span class="dt-box">${doneMap()[dayOpen]?'✓':''}</span>${doneMap()[dayOpen]?'dia concluído':'marcar dia como concluído'}</button></div>
    <div class="scroll">${rows}</div>
  </div>`;
  document.getElementById("dvBack").onclick=closeDay;
  document.getElementById("dvAdd").onclick=()=>openAddSheet(null,dayOpen);
  document.getElementById("dvPrev").onclick=()=>shiftDay(-1);
  document.getElementById("dvNext").onclick=()=>shiftDay(1);
  document.getElementById("dvDone").onclick=()=>{ toggleDone(dayOpen); renderDay(); };
  document.getElementById("dvFilter").onclick=()=>openFilterSheet(view.dayFilter,f2=>{ view.dayFilter=f2; renderDay(); });
  g.querySelectorAll("[data-tx]").forEach(el=>el.onclick=()=>openTxSheet(el.dataset.tx));
}
window.closeDay=closeDay;

/* =================== Sheet helpers =================== */
const backdrop=document.getElementById("backdrop");
const sheetEl=document.getElementById("sheet");
let sheetOpen=false;
function openSheet(html){
  sheetEl.innerHTML=html;
  if(!sheetOpen){
    sheetOpen=true; backdrop.classList.add("open");
    navPush(()=>{ sheetOpen=false; backdrop.classList.remove("open"); });
  }
}
function closeSheet(){ if(sheetOpen) navBack(); }
backdrop.onclick=e=>{ if(e.target===backdrop) closeSheet(); };
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }

/* modal de escolha (ex.: atualizar/excluir repetidas) -> Promise<key|null> */
function pickModal({title,options,cancel="cancelar"}){
  return new Promise(resolve=>{
    const m=document.getElementById("modal");
    const settle=v=>{ m.classList.remove("open"); m.innerHTML=""; m.onclick=null; resolve(v); };
    m.innerHTML=`<div class="modal-card"><div class="modal-title">${title}</div>`+
      options.map(o=>`<button class="modal-opt ${o.danger?'danger':''}" data-k="${o.key}">${o.label}</button>`).join("")+
      `<button class="modal-cancel" data-k="__cancel">${cancel}</button></div>`;
    m.classList.add("open");
    m.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>settle(el.dataset.k==="__cancel"?null:el.dataset.k));
    m.onclick=e=>{ if(e.target===m) settle(null); };
  });
}

/* dias marcados como concluídos */
function doneMap(){ return state.done||(state.done={}); }
function toggleDone(dateStr){
  const dn=doneMap();
  if(dn[dateStr]) delete dn[dateStr]; else dn[dateStr]=true;
  persist();
  const on=!!dn[dateStr];
  document.querySelectorAll(`[data-done="${dateStr}"]`).forEach(el=>{
    const row=el.closest(".balrow,.dayblock"); if(row) row.classList.toggle("done",on);
  });
  return on;
}

/* exclui um lançamento, com escolha de escopo se for repetido -> Promise<bool> */
async function deleteTx(txId){
  const t=state.tx.find(x=>x.id===txId); if(!t) return false;
  const sibs=t.series?state.tx.filter(x=>x.series===t.series):[];
  if(sibs.length>1){
    const scope=await pickModal({title:"excluir repetidas",options:[
      {key:"one",label:"excluir somente esta",danger:true},
      {key:"future",label:"excluir esta e as próximas",danger:true}]});
    if(scope===null) return false;
    if(scope==="one") state.tx=state.tx.filter(x=>x.id!==t.id);
    else state.tx=state.tx.filter(x=>!(x.series===t.series && x.date>=t.date));
  } else {
    if(!confirm("Excluir este lançamento?")) return false;
    state.tx=state.tx.filter(x=>x.id!==t.id);
  }
  persist(); return true;
}

/* filtro "mostrar" */
function openFilterSheet(current,onSelect){
  const opts=[["entradas","entrada"],["saidas","saida"],["diarios","diario"],["economias","economia"],["cartao","cartao"],["todas","todas"]];
  let list=opts.map(([f,tp])=>`<div class="sheet-opt" data-f="${f}">${tp==="todas"?'<span class="badge todas" style="background:var(--txt-2)">•••</span>':badge(tp)} ${f==="cartao"?"gastos com cartão":f}${f===current?'<span style="margin-left:auto;color:var(--accent);font-weight:800;font-size:22px">✓</span>':''}</div>`).join("");
  openSheet(`<div class="sheet-head"><h2>mostrar</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>${list}<div style="height:14px"></div>`);
  sheetEl.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{ closeSheet(); onSelect(el.dataset.f); });
}

/* adicionar / editar lançamento */
function openAddSheet(txId,presetDate){
  const editing=txId?state.tx.find(t=>t.id===txId):null;
  const _fmap={saidas:"saida",entradas:"entrada",diarios:"diario",economias:"economia",cartao:"cartao"};
  const _ctxF=dayOpen?view.dayFilter:view.filter;
  let sel=editing?editing.type:(TYPES[_fmap[_ctxF]]?_fmap[_ctxF]:"saida");
  const today=new Date();
  const defDate=editing?editing.date:(presetDate||dstr(view.y,view.m,(today.getMonth()===view.m&&today.getFullYear()===view.y)?today.getDate():1));

  const tabs=TYPE_ORDER.map(tp=>`<button class="type-tab ${tp===sel?'sel':''}" data-tp="${tp}">${badge(tp,"sm")} ${TYPES[tp].label.replace("gastos com ","")}</button>`).join("");
  const tagOpts=`<option value="">— sem tag —</option>`+state.tags.map(t=>`<option value="${t.name}" ${editing&&editing.tag===t.name?'selected':''}>${t.name}</option>`).join("");
  const cardOpts=`<option value="">— selecionar —</option>`+state.cards.map(c=>`<option value="${c.name}" ${editing&&editing.card===c.name?'selected':''}>${c.name}</option>`).join("");

  openSheet(`<div class="sheet-head"><h2>${editing?"editar":"novo lançamento"}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="type-tabs" id="typeTabs">${tabs}</div>
      <div class="amount-box"><span class="cur">R$</span> <input id="fAmount" inputmode="numeric" maxlength="16" placeholder="0,00" value="${editing?amountMask(editing.amount):''}"></div>
      <div class="field"><label>descrição</label><input type="text" id="fDesc" placeholder="ex: mercado, salário..." value="${editing?editing.desc.replace(/"/g,'&quot;'):''}"></div>
      <div class="field"><label>data</label><input type="date" id="fDate" value="${defDate}"></div>
      ${editing?"":`<div id="repeatWrap"></div>`}
      <div class="field"><label>tag</label><select id="fTag">${tagOpts}</select></div>
      <div class="field ${sel==='cartao'?'':'hidden'}" id="cardField"><label>cartão</label><select id="fCard">${cardOpts}</select></div>
      <button class="save-btn" id="saveTx">${editing?"salvar alterações":"adicionar"}</button>
      ${editing?`<button class="del-btn" id="delTx">excluir lançamento</button>`:""}
    </div>`);

  let cur=sel;
  sheetEl.querySelectorAll("[data-tp]").forEach(el=>el.onclick=()=>{
    cur=el.dataset.tp; sheetEl.querySelectorAll(".type-tab").forEach(x=>x.classList.remove("sel")); el.classList.add("sel");
    document.getElementById("cardField").classList.toggle("hidden",cur!=="cartao");
  });

  // valor: vírgula automática (conta os dígitos como centavos)
  const amtEl=document.getElementById("fAmount");
  amtEl.addEventListener("input",()=>{ amtEl.value=centsMask(amtEl.value); updateRepPreview(); });

  // repetir valor (apenas em novos lançamentos)
  let repMode="none", repCount=12, repOpen=false;
  const REP_ORDER=["monthly","weekly","daily","parcelado"];
  const REP={
    none:{label:"não repete"},
    monthly:{label:"repete mensalmente",opt:"mensalmente",desc:"repete o mesmo valor mensalmente",def:12},
    weekly:{label:"repete semanalmente",opt:"semanalmente",desc:"repete o mesmo valor semanalmente",def:8},
    daily:{label:"repete diariamente",opt:"diariamente",desc:"repete o mesmo valor diariamente",def:7},
    parcelado:{label:"parcelado",opt:"parcelado",desc:"divide o valor pelo número de parcelas",def:2}
  };
  const repPer=()=>{ const v=parseAmount(amtEl.value); return repMode==="parcelado"?(repCount>0?v/repCount:v):v; };
  function updateRepPreview(){ const p=document.getElementById("repPrev"); if(p)p.innerHTML=`# <b>${repCount}×</b> de ${brl(repPer())}`; }
  function renderRepeat(){
    const w=document.getElementById("repeatWrap"); if(!w) return;
    const icRep='<span class="rep-ic"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></span>';
    let h=`<div class="rep-head" id="repHead">${icRep}<span class="rep-name">${REP[repMode].label}</span>${repMode==="none"?'<span class="chev">▾</span>':'<button type="button" class="rep-x" id="repClear">✕</button>'}</div>`;
    if(repOpen){
      h+=`<div class="rep-opts">`+["none",...REP_ORDER].map(m=>`<div class="rep-opt ${m===repMode?'sel':''}" data-m="${m}"><div class="t">${m==="none"?"não repete":REP[m].opt}</div>${m==="none"?"":`<div class="d">${REP[m].desc}</div>`}</div>`).join("")+`</div>`;
    }
    if(repMode!=="none"){
      h+=`<div class="rep-cwrap"><div class="rl">número de ${repMode==="parcelado"?"parcelas":"repetições"}</div>
        <div class="rep-crow"><span class="rep-prev" id="repPrev"># <b>${repCount}×</b> de ${brl(repPer())}</span>
        <button type="button" class="step-btn" id="repMinus" ${repCount<=2?"disabled":""}>−</button>
        <button type="button" class="step-btn" id="repPlus">+</button></div></div>`;
    }
    w.innerHTML=h;
    document.getElementById("repHead").onclick=()=>{ repOpen=!repOpen; renderRepeat(); };
    const rx=document.getElementById("repClear"); if(rx)rx.onclick=e=>{ e.stopPropagation(); repMode="none"; repOpen=false; renderRepeat(); };
    w.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{ const m=el.dataset.m; repMode=m; if(m!=="none")repCount=REP[m].def; repOpen=false; renderRepeat(); });
    const mn=document.getElementById("repMinus"); if(mn)mn.onclick=()=>{ repCount=Math.max(2,repCount-1); renderRepeat(); };
    const pl=document.getElementById("repPlus"); if(pl)pl.onclick=()=>{ repCount=Math.min(360,repCount+1); renderRepeat(); };
  }
  if(!editing) renderRepeat();

  document.getElementById("saveTx").onclick=async()=>{
    const amt=parseAmount(document.getElementById("fAmount").value);
    if(amt<=0){ toast("Informe um valor"); return; }
    const obj={
      type:cur, amount:amt,
      desc:document.getElementById("fDesc").value.trim(),
      date:document.getElementById("fDate").value||defDate,
      tag:document.getElementById("fTag").value,
      card:cur==="cartao"?document.getElementById("fCard").value:""
    };
    if(editing){
      const sibs=editing.series?state.tx.filter(t=>t.series===editing.series):[];
      if(sibs.length>1){
        const scope=await pickModal({title:"atualizar repetidas",options:[
          {key:"one",label:"atualizar somente esta"},
          {key:"future",label:"atualizar esta e as próximas"}]});
        if(scope===null) return;   // cancelado — mantém o formulário aberto
        if(scope==="future"){
          const cut=editing.date;
          state.tx.forEach(t=>{ if(t.series===editing.series && t.id!==editing.id && t.date>=cut){
            t.type=obj.type; t.amount=obj.amount; t.desc=obj.desc; t.tag=obj.tag; t.card=obj.card;
          }});
        }
        Object.assign(editing,obj);
        toast(scope==="one"?"Lançamento atualizado":"Repetições atualizadas");
      } else { Object.assign(editing,obj); toast("Lançamento atualizado"); }
    }
    else if(repMode!=="none"){
      const n=Math.max(2,repCount|0);
      const series=uid();
      const base=new Date(obj.date+"T12:00:00");
      const per=[];
      if(repMode==="parcelado"){
        const cents=Math.round(amt*100), q=Math.floor(cents/n), r=cents-q*n;
        for(let k=0;k<n;k++) per.push((q+(k<r?1:0))/100);
      } else { for(let k=0;k<n;k++) per.push(amt); }
      for(let k=0;k<n;k++){
        const d=new Date(base);
        if(repMode==="weekly") d.setDate(d.getDate()+7*k);
        else if(repMode==="daily") d.setDate(d.getDate()+k);
        else d.setMonth(d.getMonth()+k);
        const desc = repMode==="parcelado" ? ((obj.desc||TYPE_WORD[obj.type])+` (${k+1}/${n})`) : obj.desc;
        state.tx.push({id:uid(),...obj,amount:per[k],desc,date:dstr(d.getFullYear(),d.getMonth(),d.getDate()),series,recur:true});
      }
      toast(`${n} lançamentos adicionados`);
    }
    else { state.tx.push({id:uid(),...obj}); toast("Lançamento adicionado"); }
    persist(); closeSheet();
    const mo=+obj.date.slice(5,7)-1, yr=+obj.date.slice(0,4);
    view.y=yr; view.m=mo; refresh();
  };
  if(editing) document.getElementById("delTx").onclick=async()=>{
    if(await deleteTx(editing.id)){ closeSheet(); refresh(); toast("Excluído"); }
  };
  setTimeout(()=>{ const a=document.getElementById("fAmount"); if(a&&!editing)a.focus(); },300);
}

/* toque num lançamento -> ações */
function openTxSheet(txId){
  const t=state.tx.find(x=>x.id===txId); if(!t)return;
  openSheet(`<div class="sheet-head"><h2>lançamento</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form" style="padding-bottom:24px">
      <div class="amount-box"><span class="cur">R$</span> <span style="font-size:44px;font-weight:800">${t.amount.toFixed(2).replace('.',',')}</span></div>
      <div style="text-align:center;margin:-6px 0 16px">${badge(t.type,"sm")} <span style="font-weight:700;color:var(--txt-2)">${TYPES[t.type].label}${t.card?' · '+t.card:''}${t.tag?' · '+t.tag:''}</span></div>
      <div style="text-align:center;font-size:18px;font-weight:600;margin-bottom:4px">${t.desc||"(sem descrição)"}</div>
      <div style="text-align:center;color:var(--txt-2);font-weight:600">${t.date.split('-').reverse().join('/')}</div>
      ${t.series&&state.tx.some(x=>x.series===t.series&&x.id!==t.id)?`<div style="text-align:center;color:var(--txt-2);font-weight:700;margin-top:8px">↺ lançamento repetido</div>`:""}
      <button class="save-btn" id="editThis">editar</button>
      <button class="del-btn" id="delThis">excluir</button>
    </div>`);
  document.getElementById("editThis").onclick=()=>openAddSheet(txId);
  document.getElementById("delThis").onclick=async()=>{ if(await deleteTx(txId)){ closeSheet(); refresh(); toast("Excluído"); } };
}

/* tag criar/editar */
function openTagEdit(tagId){
  const tg=tagId?state.tags.find(t=>t.id===tagId):null;
  const sw=TAG_COLORS.map(c=>`<button class="swatch ${tg&&tg.color===c?'sel':(!tg&&c===TAG_COLORS[0]?'sel':'')}" data-c="${c}" style="background:${c}"></button>`).join("");
  openSheet(`<div class="sheet-head"><h2>${tg?"editar tag":"nova tag"}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="field" style="border:none"><label>nome</label><input type="text" id="tgName" placeholder="ex: Mercado" value="${tg?tg.name.replace(/"/g,'&quot;'):''}"></div>
      <div class="field"><label>cor</label><div class="color-row" id="tgColors">${sw}</div></div>
      <button class="save-btn" id="saveTag">${tg?"salvar":"criar tag"}</button>
      ${tg?`<button class="del-btn" id="delTag">excluir tag</button>`:""}
    </div>`);
  let color=tg?tg.color:TAG_COLORS[0];
  sheetEl.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{ color=el.dataset.c; sheetEl.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); });
  document.getElementById("saveTag").onclick=()=>{
    const name=document.getElementById("tgName").value.trim();
    if(!name){ toast("Informe um nome"); return; }
    if(tg){ const old=tg.name; tg.name=name; tg.color=color; state.tx.forEach(t=>{ if(t.tag===old)t.tag=name; }); }
    else state.tags.push({id:uid(),name,color});
    persist(); closeSheet(); render(); toast("Tag salva");
  };
  if(tg)document.getElementById("delTag").onclick=()=>{ if(confirm("Excluir a tag? Os lançamentos ficam sem tag.")){ state.tags=state.tags.filter(t=>t.id!==tg.id); state.tx.forEach(t=>{ if(t.tag===tg.name)t.tag=""; }); persist(); closeSheet(); render(); toast("Tag excluída"); } };
}

/* cartões */
function openCardsSheet(){
  let list=state.cards.length?state.cards.map(c=>`<div class="mini-item" data-card="${c.id}">
      <span class="menu-ic"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="var(--txt)"/><path d="M2 10h20" stroke="var(--txt)"/></svg></span>
      <div class="info"><div class="t">${c.name}</div><div class="d">fecha dia ${c.close} · vence dia ${c.due}</div></div>
      <span class="chev" style="color:var(--txt-3);font-size:20px">›</span>
    </div>`).join(""):`<div class="empty" style="padding:30px">Nenhum cartão cadastrado.</div>`;
  openSheet(`<div class="sheet-head"><h2>cartões</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form"><div class="mini-list">${list}</div>
    <button class="save-btn" id="addCard" style="background:var(--txt)">adicionar cartão</button></div>`);
  document.getElementById("addCard").onclick=()=>openCardEdit(null);
  sheetEl.querySelectorAll("[data-card]").forEach(el=>el.onclick=()=>openCardEdit(el.dataset.card));
}
function openCardEdit(cardId){
  const c=cardId?state.cards.find(x=>x.id===cardId):null;
  openSheet(`<div class="sheet-head"><h2>${c?"editar cartão":"novo cartão"}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="field" style="border:none"><label>nome</label><input type="text" id="cName" placeholder="ex: Nubank" value="${c?c.name.replace(/"/g,'&quot;'):''}"></div>
      <div class="field"><label>dia do fechamento</label><input type="text" inputmode="numeric" id="cClose" placeholder="1–31" value="${c?c.close:''}"></div>
      <div class="field"><label>dia do vencimento</label><input type="text" inputmode="numeric" id="cDue" placeholder="1–31" value="${c?c.due:''}"></div>
      <button class="save-btn" id="saveCard">${c?"salvar":"adicionar"}</button>
      ${c?`<button class="del-btn" id="delCard">excluir cartão</button>`:""}
    </div>`);
  document.getElementById("saveCard").onclick=()=>{
    const name=document.getElementById("cName").value.trim();
    const close=Math.min(31,Math.max(1,parseInt(document.getElementById("cClose").value)||1));
    const due=Math.min(31,Math.max(1,parseInt(document.getElementById("cDue").value)||1));
    if(!name){ toast("Informe um nome"); return; }
    if(c){ c.name=name; c.close=close; c.due=due; } else state.cards.push({id:uid(),name,close,due});
    persist(); openCardsSheet(); toast("Cartão salvo");
  };
  if(c)document.getElementById("delCard").onclick=()=>{ if(confirm("Excluir cartão?")){ state.cards=state.cards.filter(x=>x.id!==c.id); persist(); openCardsSheet(); } };
}

/* valores de configuração */
function promptValue(title,key){
  openSheet(`<div class="sheet-head"><h2>${title}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="amount-box"><span class="cur">R$</span> <input id="pv" inputmode="decimal" placeholder="0,00" value="${(state.settings[key]||0).toFixed(2).replace('.',',')}"></div>
      <button class="save-btn" id="pvSave">salvar</button>
    </div>`);
  document.getElementById("pvSave").onclick=()=>{ state.settings[key]=parseAmount(document.getElementById("pv").value); persist(); closeSheet(); render(); toast("Salvo"); };
  setTimeout(()=>document.getElementById("pv").focus(),300);
}

/* export / import */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`financas_${new Date().toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(a.href); toast("Arquivo gerado");
}
function importData(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.tx)throw 0; state=d; if(!state.settings)state.settings={initial:0,forecast:0,theme:"light"}; persist(); applyTheme(); render(); toast("Dados importados"); }catch(e){ toast("Arquivo inválido"); } };
    r.readAsText(f); };
  inp.click();
}

/* tema */
function applyTheme(){
  document.documentElement.setAttribute("data-theme",state.settings.theme==="dark"?"dark":"light");
  document.querySelector('meta[name=theme-color]').setAttribute("content",state.settings.theme==="dark"?"#000000":"#ffffff");
}
window.closeSheet=closeSheet;

/* =================== Auth + sincronização na nuvem =================== */
function setupAuthGate(){
  auth.onAuthStateChanged(u=>{
    if(u){
      authUid=u.uid; authEmail=u.email; hideLogin(); subscribeCloud();
    }else{
      authUid=null; authEmail=null; cloudReady=false; cloudRef=null;
      if(unsub){ unsub(); unsub=null; }
      clearTimeout(loadFallback); loadFallback=null;
      hideLoading(); connSet(false);
      showLogin();
    }
  });
}
let cloudRef=null, loadFallback=null, lastServerSync=null;
function adoptCloud(data){
  state=data;
  if(!state.settings) state.settings={initial:0,forecast:0,theme:"light"};
  applyTheme(); refresh();
}
function subscribeCloud(){
  cloudRef=db.collection("users").doc(authUid);
  showLoading();
  unsub=cloudRef.onSnapshot({includeMetadataChanges:true}, snap=>{
    const md=snap.metadata||{};
    // ignora ecos das nossas próprias gravações ainda não confirmadas
    if(md.hasPendingWrites) return;
    const fromServer=!md.fromCache;
    connSet(!fromServer);                 // snapshot vindo do cache = sem conexão

    if(fromServer){
      cloudReady=true;                    // só libera gravação após falar com o servidor
      clearTimeout(loadFallback);
      if(snap.exists){
        const data=snap.data();
        if(JSON.stringify(data)!==JSON.stringify(state)) adoptCloud(data);
      }else{
        // servidor CONFIRMOU que o documento não existe -> 1º acesso (cria vazio)
        cloudRef.set(state).catch(()=>connSet(true));
      }
      lastServerSync=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      hideLoading();
      if(view.tab==="menu") render();
    }else{
      // veio do cache (provavelmente offline): nunca sobrescreve a nuvem
      if(snap.exists){
        const data=snap.data();
        if(JSON.stringify(data)!==JSON.stringify(state)) adoptCloud(data);
        hideLoading();
      }else if(!loadFallback){
        // sem resposta do servidor: espera um pouco e mostra o app (vazio) com o aviso
        loadFallback=setTimeout(hideLoading,2500);
      }
    }
  }, ()=>{ connSet(true); hideLoading(); refresh(); });
}
// Sincronização manual (para resolver divergências entre aparelhos)
function forcePull(){
  if(!cloudRef){ toast("Entre na conta primeiro"); return; }
  toast("Baixando da nuvem...");
  cloudRef.get({source:"server"}).then(snap=>{
    if(snap.exists){ adoptCloud(snap.data()); toast("Dados da nuvem carregados"); }
    else toast("A nuvem ainda está vazia");
  }).catch(()=>toast("Sem conexão com a nuvem"));
}
function forcePush(){
  if(!cloudRef){ toast("Entre na conta primeiro"); return; }
  cloudReady=true;
  cloudRef.set(state).then(()=>toast("Enviado para a nuvem")).catch(()=>toast("Sem conexão com a nuvem"));
}
function authMsg(code){
  return ({
    "auth/invalid-email":"E-mail inválido",
    "auth/user-not-found":"Conta não encontrada",
    "auth/wrong-password":"Senha incorreta",
    "auth/invalid-credential":"E-mail ou senha incorretos",
    "auth/too-many-requests":"Muitas tentativas — tente mais tarde",
    "auth/network-request-failed":"Sem conexão com a internet"
  })[code] || "Não foi possível entrar";
}
function showLogin(){
  navStack=[];
  const g=document.getElementById("authgate");
  g.style.display="block";
  g.innerHTML=`<div class="login-screen">
    <div class="login-brand">
      <img src="${window.APP_ICON||''}" alt="" style="width:98px;height:98px;margin:0 auto 18px;display:block">
      <h1>Termômetro</h1><p>Entre para acessar suas finanças</p>
    </div>
    <div class="field" style="border:none"><label>e-mail</label><input type="email" id="liEmail" autocomplete="username" inputmode="email" placeholder="voce@email.com"></div>
    <div class="field"><label>senha</label><input type="password" id="liPass" autocomplete="current-password" placeholder="••••••••"></div>
    <div id="liErr" class="login-err"></div>
    <button class="save-btn" id="liBtn" style="margin-top:4px">entrar</button>
    <button class="login-link" id="liReset">esqueci minha senha</button>
  </div>`;
  const err=m=>{ document.getElementById("liErr").textContent=m; };
  const doLogin=()=>{
    const e=document.getElementById("liEmail").value.trim();
    const p=document.getElementById("liPass").value;
    if(!e||!p){ err("Preencha e-mail e senha"); return; }
    err(""); document.getElementById("liBtn").textContent="entrando...";
    auth.signInWithEmailAndPassword(e,p).catch(x=>{ err(authMsg(x.code)); document.getElementById("liBtn").textContent="entrar"; });
  };
  document.getElementById("liBtn").onclick=doLogin;
  document.getElementById("liPass").onkeydown=ev=>{ if(ev.key==="Enter")doLogin(); };
  document.getElementById("liReset").onclick=()=>{
    const e=document.getElementById("liEmail").value.trim();
    if(!e){ err("Digite seu e-mail para redefinir"); return; }
    auth.sendPasswordResetEmail(e).then(()=>err("Enviamos um link de redefinição")).catch(x=>err(authMsg(x.code)));
  };
}
function hideLogin(){ const g=document.getElementById("authgate"); g.style.display="none"; g.innerHTML=""; }

/* =================== Navegação (botão voltar do navegador) =================== */
/* Cada tela/painel empilha um "desfazer". Voltar no navegador fecha o topo da pilha
   em vez de sair do app; só sai quando não há mais nada empilhado (tela inicial). */
let navStack=[];
function navPush(undo){ navStack.push(undo); try{ history.pushState({d:navStack.length},""); }catch(e){} }
function navBack(){ if(navStack.length){ try{ history.back(); }catch(e){ (navStack.pop())(); } } }
window.addEventListener("popstate", ()=>{
  if(navStack.length){ const undo=navStack.pop(); try{ undo(); }catch(e){} }
});
function switchTab(id){
  if(id===view.tab) return;
  const prev=view.tab; view.tab=id; render();
  navPush(()=>{ view.tab=prev; render(); });
}

/* =================== Tela cheia =================== */
function isFullscreen(){ return document.fullscreenElement||document.webkitFullscreenElement; }
function toggleFullscreen(){
  const el=document.documentElement, d=document;
  if(!isFullscreen()){
    const req=el.requestFullscreen||el.webkitRequestFullscreen||el.webkitRequestFullScreen;
    if(req) req.call(el).then(()=>{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{});}).catch(()=>toast("Tela cheia indisponível neste navegador"));
    else toast("No iPhone, use Compartilhar → Adicionar à Tela de Início");
  }else{
    const ex=d.exitFullscreen||d.webkitExitFullscreen; if(ex) ex.call(d);
  }
  setTimeout(()=>{ if(view.tab==="menu")render(); },200);
}

/* =================== Conectividade / carregamento =================== */
let connLost=false;
function connSet(lost){
  connLost=!!lost;
  const b=document.getElementById("netbar");
  if(b){ b.textContent="Sem conexão — as alterações não serão salvas"; b.classList.toggle("show", connLost && FB_ON); }
  if(view.tab==="menu") render();
}
function showLoading(){ const e=document.getElementById("cloudload"); if(e)e.classList.add("show"); }
function hideLoading(){ const e=document.getElementById("cloudload"); if(e)e.classList.remove("show"); }
if(FB_ON){
  window.addEventListener("offline", ()=>connSet(true));
  window.addEventListener("online", ()=>connSet(false));
}

/* =================== Boot =================== */
applyTheme();
if(FB_ON){ render(); setupAuthGate(); }
else{ Store.save(state); render(); }
</script>
