/* modal de escolha (ex.: atualizar/excluir repetidas) -> Promise<key|null> */
function pickModal({title,note="",options,cancel="cancelar"}){
  return new Promise(resolve=>{
    const m=document.getElementById("modal");
    const settle=v=>{ m.classList.remove("open"); m.onclick=null; setTimeout(()=>{ if(!m.classList.contains("open")) m.innerHTML=""; },var_dur()); resolve(v); };
    m.innerHTML=`<div class="modal-card"><div class="modal-title">${esc(title)}</div>`+
      (note?`<div class="modal-note">${esc(note)}</div>`:"")+
      options.map(o=>`<button class="modal-opt ${o.danger?'danger':''}" data-k="${o.key}">${o.label}</button>`).join("")+
      `<button class="modal-cancel" data-k="__cancel">${cancel}</button></div>`;
    requestAnimationFrame(()=>m.classList.add("open"));
    m.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>settle(el.dataset.k==="__cancel"?null:el.dataset.k));
    m.onclick=e=>{ if(e.target===m) settle(null); };
  });
}
function var_dur(){ const v=getComputedStyle(document.documentElement).getPropertyValue("--dur"); return (parseFloat(v)||.28)*1000+40; }

/* dias marcados como concluídos */
function doneMap(){ return state.done||(state.done={}); }
function toggleDone(dateStr){
  const dn=doneMap();
  if(dn[dateStr]) delete dn[dateStr]; else dn[dateStr]=true;
  persist();
  const on=!!dn[dateStr];
  document.querySelectorAll(`[data-done="${dateStr}"]`).forEach(el=>{
    const row=el.closest(".balrow,.dayblock"); if(row) row.classList.toggle("done",on);
  });
  return on;
}

/* exclui um lançamento, com escolha de escopo se for repetido -> Promise<bool> */
async function deleteTx(txId){
  const t=state.tx.find(x=>x.id===txId); if(!t) return false;
  const sibs=t.series?state.tx.filter(x=>x.series===t.series):[];
  if(sibs.length>1){
    const scope=await pickModal({title:isParcela(t)?"excluir parcelas":"excluir repetidas",options:[
      {key:"one",label:"excluir somente esta",danger:true},
      {key:"future",label:"excluir esta e as próximas",danger:true}]});
    if(scope===null) return false;
    if(scope==="one") state.tx=state.tx.filter(x=>x.id!==t.id);
    else state.tx=state.tx.filter(x=>!(x.series===t.series && x.date>=t.date));
  } else {
    const ok=await pickModal({title:"excluir lançamento",options:[{key:"del",label:"excluir",danger:true}]});
    if(ok!=="del") return false;
    state.tx=state.tx.filter(x=>x.id!==t.id);
  }
  persist(); return true;
}

/* filtro "mostrar" */
function openFilterSheet(current,onSelect){
  const opts=[["entradas","entrada"],["saidas","saida"],["diarios","diario"],["economias","economia"],["cartao","cartao"],["todas","todas"]];
  let list=opts.map(([f,tp])=>`<div class="sheet-opt" data-f="${f}">${tp==="todas"?'<span class="badge todas" style="background:var(--txt-2)">•••</span>':badge(tp)} ${f==="cartao"?"gastos com cartão":f}${f===current?'<span style="margin-left:auto;color:var(--accent);font-weight:800;font-size:22px">✓</span>':''}</div>`).join("");
  openSheet(`<div class="sheet-head"><h2>mostrar</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>${list}<div style="height:14px"></div>`);
  sheetEl.querySelectorAll("[data-f]").forEach(el=>el.onclick=()=>{ closeSheet(); onSelect(el.dataset.f); });
}

/* adicionar / editar lançamento */
function openAddSheet(txId,presetDate){
  const editing=txId?state.tx.find(t=>t.id===txId):null;
  const _fmap={saidas:"saida",entradas:"entrada",diarios:"diario",economias:"economia",cartao:"cartao"};
  const _ctxF=dayOpen?view.dayFilter:view.filter;
  let sel=editing?editing.type:(TYPES[_fmap[_ctxF]]?_fmap[_ctxF]:"saida");
  const today=new Date();
  const defDate=editing?editing.date:(presetDate||dstr(view.y,view.m,(today.getMonth()===view.m&&today.getFullYear()===view.y)?today.getDate():1));

  const tabs=TYPE_ORDER.map(tp=>`<button class="type-tab ${tp===sel?'sel':''}" data-tp="${tp}">${badge(tp,"sm")} ${TYPES[tp].label.replace("gastos com ","")}</button>`).join("");
  const tagOpts=`<option value="">— sem tag —</option>`+state.tags.map(t=>`<option value="${esc(t.name)}" ${editing&&editing.tag===t.name?'selected':''}>${esc(t.name)}</option>`).join("");
  const cardOpts=`<option value="">— selecionar —</option>`+state.cards.map(c=>`<option value="${esc(c.name)}" ${editing&&editing.card===c.name?'selected':''}>${esc(c.name)}</option>`).join("");

  openSheet(`<div class="sheet-head"><h2>${editing?"editar":"novo lançamento"}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="type-tabs" id="typeTabs">${tabs}</div>
      <div class="amount-box"><span class="cur">R$</span> <input id="fAmount" inputmode="numeric" maxlength="16" placeholder="0,00" value="${editing?amountMask(editing.amount):''}"></div>
      <div class="field"><label>descrição</label><input type="text" id="fDesc" placeholder="ex: mercado, salário..." value="${editing?esc(editing.desc):''}"></div>
      <div class="field"><label>data</label><input type="date" id="fDate" value="${defDate}"></div>
      ${editing?"":`<div id="repeatWrap" class="${sel==='cartao'?'hidden':''}"></div>`}
      <div class="field"><label>tag</label><select id="fTag">${tagOpts}</select></div>
      <div class="field ${sel==='cartao'?'':'hidden'}" id="cardField"><label>cartão</label><select id="fCard">${cardOpts}</select></div>
      <div class="field ${sel==='cartao'?'':'hidden'}" id="faturaField"><label>fatura inicial</label><select id="fFatura"></select></div>
      ${editing?"":`<div id="parcWrap" class="${sel==='cartao'?'':'hidden'}"></div>`}
      <button class="save-btn" id="saveTx">${editing?"salvar alterações":"adicionar"}</button>
      ${editing?`<button class="del-btn" id="delTx">excluir lançamento</button>`:""}
    </div>`);

  let cur=sel;

  // ---- cartão: fatura inicial + parcelas ----
  let parc=1;
  let faturaAuto=!(editing&&editing.type==="cartao"&&editing.fatura);
  let faturaChoice=(editing&&editing.type==="cartao"&&editing.fatura)
      ? editing.fatura
      : defaultFatura(defDate,(editing&&editing.card)||(state.cards[0]?state.cards[0].name:""));
  const purchaseDate=()=>document.getElementById("fDate").value||defDate;
  function rebuildFatura(){
    const s=document.getElementById("fFatura"); if(!s) return;
    const idxOf=k=>{ const y=+k.slice(0,4),m=+k.slice(5,7)-1; return y*12+m; };
    const keyOf=i=>faturaKey(Math.floor(i/12),((i%12)+12)%12);
    let lo=idxOf(purchaseDate().slice(0,7))-3, hi=lo+3+21;
    const ci=idxOf(faturaChoice); if(ci<lo)lo=ci; if(ci>hi)hi=ci;
    let opts="";
    for(let i=lo;i<=hi;i++){ const k=keyOf(i); opts+=`<option value="${k}" ${k===faturaChoice?'selected':''}>${faturaLabel(k)}</option>`; }
    s.innerHTML=opts;
  }
  function renderParc(){
    const w=document.getElementById("parcWrap"); if(!w) return;
    const amt=parseAmount(amtEl.value), per=parc>0?amt/parc:amt;
    const ay=+faturaChoice.slice(0,4), am=+faturaChoice.slice(5,7);
    const endTot=(am-1)+(parc-1), ey=ay+Math.floor(endTot/12), emm=((endTot%12)+12)%12;
    const span=parc>1?`${faturaLabel(faturaChoice)} → ${MN[emm]}/${String(ey).slice(2)}`:`fatura ${faturaLabel(faturaChoice)}`;
    w.innerHTML=`<div class="rep-cwrap"><div class="rl">parcelas</div>
      <div class="rep-crow"><span class="rep-prev">${parc>1?`# <b>${parc}×</b> de ${brl(per)}`:'<b>à vista</b>'} <span style="color:var(--txt-3)">· ${span}</span></span>
      <button type="button" class="step-btn" id="parcMinus" ${parc<=1?"disabled":""}>−</button>
      <button type="button" class="step-btn" id="parcPlus">+</button></div></div>`;
    const mn=document.getElementById("parcMinus"); if(mn)mn.onclick=()=>{ parc=Math.max(1,parc-1); renderParc(); };
    const pl=document.getElementById("parcPlus"); if(pl)pl.onclick=()=>{ parc=Math.min(360,parc+1); renderParc(); };
  }
  function refreshFaturaDefault(){ if(faturaAuto) faturaChoice=defaultFatura(purchaseDate(),document.getElementById("fCard").value); }
  function syncCartao(){
    const on=cur==="cartao";
    ["cardField","faturaField","parcWrap"].forEach(id=>{ const e=document.getElementById(id); if(e)e.classList.toggle("hidden",!on); });
    const rw=document.getElementById("repeatWrap"); if(rw)rw.classList.toggle("hidden",on);
    if(on){ refreshFaturaDefault(); rebuildFatura(); renderParc(); }
  }

  sheetEl.querySelectorAll("[data-tp]").forEach(el=>el.onclick=()=>{
    cur=el.dataset.tp; sheetEl.querySelectorAll(".type-tab").forEach(x=>x.classList.remove("sel")); el.classList.add("sel");
    syncCartao();
  });
  const fCardEl=document.getElementById("fCard");
  if(fCardEl)fCardEl.onchange=()=>{ refreshFaturaDefault(); rebuildFatura(); renderParc(); };
  const fDateEl=document.getElementById("fDate");
  if(fDateEl)fDateEl.addEventListener("change",()=>{ if(cur==="cartao"){ refreshFaturaDefault(); rebuildFatura(); renderParc(); } });
  const fFaturaEl=document.getElementById("fFatura");
  if(fFaturaEl)fFaturaEl.onchange=()=>{ faturaChoice=fFaturaEl.value; faturaAuto=false; renderParc(); };

  // valor: vírgula automática (conta os dígitos como centavos)
  const amtEl=document.getElementById("fAmount");
  amtEl.addEventListener("input",()=>{ amtEl.value=centsMask(amtEl.value); updateRepPreview(); if(cur==="cartao")renderParc(); });

  // repetir valor (apenas em novos lançamentos)
  let repMode="none", repCount=12, repOpen=false;
  const REP_ORDER=["monthly","weekly","daily","parcelado"];
  const REP={
    none:{label:"não repete"},
    monthly:{label:"repete mensalmente",opt:"mensalmente",desc:"repete o mesmo valor mensalmente",def:12},
    weekly:{label:"repete semanalmente",opt:"semanalmente",desc:"repete o mesmo valor semanalmente",def:8},
    daily:{label:"repete diariamente",opt:"diariamente",desc:"repete o mesmo valor diariamente",def:7},
    parcelado:{label:"parcelado",opt:"parcelado",desc:"divide o valor pelo número de parcelas",def:2}
  };
  const repPer=()=>{ const v=parseAmount(amtEl.value); return repMode==="parcelado"?(repCount>0?v/repCount:v):v; };
  function updateRepPreview(){ const p=document.getElementById("repPrev"); if(p)p.innerHTML=`# <b>${repCount}×</b> de ${brl(repPer())}`; }
  function renderRepeat(){
    const w=document.getElementById("repeatWrap"); if(!w) return;
    const icRep='<span class="rep-ic"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg></span>';
    let h=`<div class="rep-head" id="repHead">${icRep}<span class="rep-name">${REP[repMode].label}</span>${repMode==="none"?'<span class="chev">▾</span>':'<button type="button" class="rep-x" id="repClear">✕</button>'}</div>`;
    if(repOpen){
      h+=`<div class="rep-opts">`+["none",...REP_ORDER].map(m=>`<div class="rep-opt ${m===repMode?'sel':''}" data-m="${m}"><div class="t">${m==="none"?"não repete":REP[m].opt}</div>${m==="none"?"":`<div class="d">${REP[m].desc}</div>`}</div>`).join("")+`</div>`;
    }
    if(repMode!=="none"){
      h+=`<div class="rep-cwrap"><div class="rl">número de ${repMode==="parcelado"?"parcelas":"repetições"}</div>
        <div class="rep-crow"><span class="rep-prev" id="repPrev"># <b>${repCount}×</b> de ${brl(repPer())}</span>
        <button type="button" class="step-btn" id="repMinus" ${repCount<=2?"disabled":""}>−</button>
        <button type="button" class="step-btn" id="repPlus">+</button></div></div>`;
    }
    w.innerHTML=h;
    document.getElementById("repHead").onclick=()=>{ repOpen=!repOpen; renderRepeat(); };
    const rx=document.getElementById("repClear"); if(rx)rx.onclick=e=>{ e.stopPropagation(); repMode="none"; repOpen=false; renderRepeat(); };
    w.querySelectorAll("[data-m]").forEach(el=>el.onclick=()=>{ const m=el.dataset.m; repMode=m; if(m!=="none")repCount=REP[m].def; repOpen=false; renderRepeat(); });
    const mn=document.getElementById("repMinus"); if(mn)mn.onclick=()=>{ repCount=Math.max(2,repCount-1); renderRepeat(); };
    const pl=document.getElementById("repPlus"); if(pl)pl.onclick=()=>{ repCount=Math.min(360,repCount+1); renderRepeat(); };
  }
  if(!editing) renderRepeat();
  syncCartao();

  document.getElementById("saveTx").onclick=async()=>{
    const amt=parseAmount(document.getElementById("fAmount").value);
    if(amt<=0){ toast("Informe um valor"); return; }
    const obj={
      type:cur, amount:amt,
      desc:document.getElementById("fDesc").value.trim(),
      date:document.getElementById("fDate").value||defDate,
      tag:document.getElementById("fTag").value,
      card:cur==="cartao"?document.getElementById("fCard").value:""
    };
    if(cur==="cartao") obj.fatura=faturaChoice;
    if(editing){
      const sibs=editing.series?state.tx.filter(t=>t.series===editing.series):[];
      if(sibs.length>1){
        const scope=await pickModal({title:isParcela(editing)?"atualizar parcelas":"atualizar repetidas",options:[
          {key:"one",label:"atualizar somente esta"},
          {key:"future",label:"atualizar esta e as próximas"}]});
        if(scope===null) return;   // cancelado — mantém o formulário aberto
        if(scope==="future"){
          const cut=editing.date;
          state.tx.forEach(t=>{ if(t.series===editing.series && t.id!==editing.id && t.date>=cut){
            t.type=obj.type; t.amount=obj.amount; t.desc=obj.desc; t.tag=obj.tag; t.card=obj.card;
          }});
        }
        Object.assign(editing,obj);
        toast(scope==="one"?"Lançamento atualizado":"Repetições atualizadas");
      } else { Object.assign(editing,obj); toast("Lançamento atualizado"); }
    }
    else if(cur==="cartao"){
      const n=Math.max(1,parc|0);
      const cents=Math.round(amt*100), q=Math.floor(cents/n), r=cents-q*n;
      const ay=+faturaChoice.slice(0,4), am=+faturaChoice.slice(5,7)-1;
      const bd=+obj.date.slice(8,10);
      const series=n>1?uid():null;
      const buyDate=obj.date;                      // data real da compra, igual para todas as parcelas
      for(let k=0;k<n;k++){
        const tot=am+k, ny=ay+Math.floor(tot/12), nm=((tot%12)+12)%12;
        const dateStr=dstr(ny,nm,Math.min(bd,daysInMonth(ny,nm)));
        const rec={id:uid(),...obj,amount:(q+(k<r?1:0))/100,
          desc:n>1?((obj.desc||TYPE_WORD.cartao)+` (${k+1}/${n})`):obj.desc,
          date:dateStr,
          buyDate,
          fatura:faturaKey(ny,nm)};
        if(n>1){ rec.series=series; rec.kind="parcela"; }
        state.tx.push(rec);
      }
      toast(n>1?`${n} parcelas adicionadas`:"Lançamento adicionado");
    }
    else if(repMode!=="none"){
      const n=Math.max(2,repCount|0);
      const series=uid();
      const by=+obj.date.slice(0,4), bm=+obj.date.slice(5,7)-1, bd=+obj.date.slice(8,10);
      const per=[];
      if(repMode==="parcelado"){
        const cents=Math.round(amt*100), q=Math.floor(cents/n), r=cents-q*n;
        for(let k=0;k<n;k++) per.push((q+(k<r?1:0))/100);
      } else { for(let k=0;k<n;k++) per.push(amt); }
      for(let k=0;k<n;k++){
        let dateStr;
        if(repMode==="weekly"||repMode==="daily"){
          const d=new Date(obj.date+"T12:00:00");
          d.setDate(d.getDate()+(repMode==="weekly"?7*k:k));
          dateStr=dstr(d.getFullYear(),d.getMonth(),d.getDate());
        } else {                                   // mensal / parcelado: soma meses e limita ao último dia do mês
          const tot=bm+k, ny=by+Math.floor(tot/12), nm=((tot%12)+12)%12;
          dateStr=dstr(ny,nm,Math.min(bd,daysInMonth(ny,nm)));
        }
        // toda série finita é numerada: "Imposto de renda (3/8)"
        const desc = (obj.desc||TYPE_WORD[obj.type])+` (${k+1}/${n})`;
        const rec={id:uid(),...obj,amount:per[k],desc,date:dateStr,series};
        if(repMode==="parcelado"){ rec.kind="parcela"; }
        else { rec.kind="recorrente"; rec.recur=true; }
        state.tx.push(rec);
      }
      toast(`${n} lançamentos adicionados`);
    }
    else { state.tx.push({id:uid(),...obj}); toast("Lançamento adicionado"); }
    persist(); closeSheet();
    const jump=(cur==="cartao"&&obj.fatura)?obj.fatura:obj.date.slice(0,7);
    view.y=+jump.slice(0,4); view.m=+jump.slice(5,7)-1; refresh();
  };
  if(editing) document.getElementById("delTx").onclick=async()=>{
    if(await deleteTx(editing.id)){ closeSheet(); refresh(); toast("Excluído"); }
  };
  setTimeout(()=>{ const a=document.getElementById("fAmount"); if(a&&!editing)a.focus(); },300);
}

/* toque num lançamento -> ações */
function openTxSheet(txId){
  if(String(txId).indexOf("fc-")===0){ openForecastSheet(); return; }   // previsão é virtual
  const t=state.tx.find(x=>x.id===txId); if(!t)return;
  openSheet(`<div class="sheet-head"><h2>lançamento</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form" style="padding-bottom:24px">
      <div class="amount-box"><span class="cur">R$</span> <span style="font-size:44px;font-weight:800">${t.amount.toFixed(2).replace('.',',')}</span></div>
      <div style="text-align:center;margin:-6px 0 16px">${badge(t.type,"sm")} <span style="font-weight:700;color:var(--txt-2)">${TYPES[t.type].label}${t.card?' · '+esc(t.card):''}${t.tag?' · '+esc(t.tag):''}</span></div>
      <div style="text-align:center;font-size:18px;font-weight:600;margin-bottom:4px">${esc(t.desc)||"(sem descrição)"}</div>
      <div style="text-align:center;color:var(--txt-2);font-weight:600">${t.date.split('-').reverse().join('/')}</div>
      ${t.type==="cartao"&&t.fatura&&cardBy(t.card)?`<button id="verFatura" style="display:block;margin:8px auto 0;background:none;border:none;color:var(--cartao);font-weight:800;font-size:16px">ver fatura de ${faturaLabel(t.fatura)} ›</button>`:(t.type==="cartao"&&t.fatura?`<div style="text-align:center;color:var(--cartao);font-weight:800;margin-top:6px">fatura de ${faturaLabel(t.fatura)}</div>`:"")}
      ${t.series&&state.tx.some(x=>x.series===t.series&&x.id!==t.id)?`<div style="text-align:center;color:var(--txt-2);font-weight:700;margin-top:8px">${isParcela(t)?"# lançamento parcelado":"↺ lançamento repetido"}</div>`:""}
      <button class="pago-toggle ${isPago(t)?'on':''} ${isAtrasado(t)?'late':''}" id="pagoThis">
        <span class="pg-box">${isPago(t)?"✓":""}</span>
        <span class="pg-txt">${isPago(t)?"pago":(isAtrasado(t)?"pendente · vencido":"previsto")}</span>
        <span class="pg-hint">${t.pago===undefined?"pela data":"marcado por você"}</span>
      </button>
      <button class="save-btn" id="editThis">editar</button>
      <button class="del-btn" id="delThis">excluir</button>
    </div>`);
  document.getElementById("pagoThis").onclick=()=>{
    setPago(t,!isPago(t)); persist(); refresh(); openTxSheet(txId);
    toast(isPago(t)?"Marcado como pago":"Marcado como previsto");
  };
  const vf=document.getElementById("verFatura");
  if(vf)vf.onclick=()=>{ const c=cardBy(t.card); closeSheet(); openFatura(c.id,t.fatura); };
  document.getElementById("editThis").onclick=()=>openAddSheet(txId);
  document.getElementById("delThis").onclick=async()=>{ if(await deleteTx(txId)){ closeSheet(); refresh(); toast("Excluído"); } };
}

/* tag criar/editar */
function openTagEdit(tagId){
  const tg=tagId?state.tags.find(t=>t.id===tagId):null;
  const sw=TAG_COLORS.map(c=>`<button class="swatch ${tg&&tg.color===c?'sel':(!tg&&c===TAG_COLORS[0]?'sel':'')}" data-c="${c}" style="background:${c}"></button>`).join("");
  openSheet(`<div class="sheet-head"><h2>${tg?"editar tag":"nova tag"}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="field" style="border:none"><label>nome</label><input type="text" id="tgName" placeholder="ex: Mercado" value="${tg?esc(tg.name):''}"></div>
      <div class="field"><label>cor</label><div class="color-row" id="tgColors">${sw}</div></div>
      <button class="save-btn" id="saveTag">${tg?"salvar":"criar tag"}</button>
      ${tg?`<button class="del-btn" id="delTag">excluir tag</button>`:""}
    </div>`);
  let color=tg?tg.color:TAG_COLORS[0];
  sheetEl.querySelectorAll("[data-c]").forEach(el=>el.onclick=()=>{ color=el.dataset.c; sheetEl.querySelectorAll(".swatch").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); });
  document.getElementById("saveTag").onclick=()=>{
    const name=document.getElementById("tgName").value.trim();
    if(!name){ toast("Informe um nome"); return; }
    if(state.tags.some(x=>x.name===name&&(!tg||x.id!==tg.id))){ toast("Já existe uma tag com esse nome"); return; }
    if(tg){ const old=tg.name; tg.name=name; tg.color=color; state.tx.forEach(t=>{ if(t.tag===old)t.tag=name; }); }
    else state.tags.push({id:uid(),name,color});
    persist(); closeSheet(); refresh(); toast("Tag salva");
  };
  if(tg)document.getElementById("delTag").onclick=async()=>{
    const n=state.tx.filter(t=>t.tag===tg.name).length;
    const ok=await pickModal({
      title:`excluir ${tg.name}`,
      note:n?`${n} ${n===1?"lançamento ficará":"lançamentos ficarão"} sem tag. Os valores não mudam.`:"Nenhum lançamento usa esta tag.",
      options:[{key:"del",label:"excluir tag",danger:true}]
    });
    if(ok!=="del") return;
    state.tags=state.tags.filter(t=>t.id!==tg.id);
    state.tx.forEach(t=>{ if(t.tag===tg.name)t.tag=""; });
    persist(); closeSheet(); refresh(); toast("Tag excluída");
  };
}

/* cartões */
function openCardsSheet(){
  let list=state.cards.length?state.cards.map(c=>`<div class="mini-item" data-card="${c.id}">
      <span class="menu-ic" style="background:${cardColor(c)}"><svg viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="2" stroke="#fff"/><path d="M2 10h20" stroke="#fff"/></svg></span>
      <div class="info"><div class="t">${esc(c.name)}</div><div class="d">fecha dia ${c.close} · vence dia ${c.due}</div></div>
      <span class="chev" style="color:var(--txt-3);font-size:20px">›</span>
    </div>`).join(""):`<div class="empty" style="padding:30px">Nenhum cartão cadastrado.</div>`;
  openSheet(`<div class="sheet-head"><h2>cartões</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form"><div class="mini-list">${list}</div>
    <button class="save-btn" id="addCard" style="background:var(--txt)">adicionar cartão</button></div>`);
  document.getElementById("addCard").onclick=()=>openCardEdit(null);
  sheetEl.querySelectorAll("[data-card]").forEach(el=>el.onclick=()=>openCardEdit(el.dataset.card));
}
function openCardEdit(cardId){
  const c=cardId?state.cards.find(x=>x.id===cardId):null;
  const used=new Set(state.cards.filter(x=>!c||x.id!==c.id).map(x=>x.color).filter(Boolean));
  const defCol=c?(c.color||cardColor(c)):(CARD_COLORS.find(k=>!used.has(k))||CARD_COLORS[state.cards.length%CARD_COLORS.length]);
  let color=defCol;
  const sw=CARD_COLORS.map(k=>`<button class="swatch ${k===defCol?'sel':''}" data-c="${k}" style="background:${k}"></button>`).join("");
  openSheet(`<div class="sheet-head"><h2>${c?"editar cartão":"novo cartão"}</h2><button class="xbtn" onclick="closeSheet()">✕</button></div>
    <div class="form">
      <div class="field" style="border:none"><label>nome</label><input type="text" id="cName" placeholder="ex: Nubank" value="${c?esc(c.name):''}"></div>
      <div class="field"><label>cor</label><div class="color-row" id="cColors">${sw}</div></div>
      <div class="field"><label>dia do fechamento</label><input type="text" inputmode="numeric" id="cClose" placeholder="1–31" value="${c?c.close:''}"></div>
      <div class="field"><label>dia do vencimento</label><input type="text" inputmode="numeric" id="cDue" placeholder="1–31" value="${c?c.due:''}"></div>
      <button class="save-btn" id="saveCard">${c?"salvar":"adicionar"}</button>
      ${c?`<button class="del-btn" id="delCard">excluir cartão</button>`:""}
    </div>`);

    const due=Math.min(31,Math.max(1,parseInt(document.getElementById("cDue").value)||1));
    if(!name){ toast("Informe um nome"); return; }
    if(state.cards.some(x=>x.name===name&&(!c||x.id!==c.id))){ toast("Já existe um cartão com esse nome"); return; }
    if(c){
      const old=c.name;
      c.name=name; c.close=close; c.due=due; c.color=color;
      // lançamentos guardam o NOME do cartão: sem este cascade eles ficariam órfãos
      if(old!==name) state.tx.forEach(t=>{ if(t.card===old) t.card=name; });
    } else state.cards.push({id:uid(),name,close,due,color});
    persist(); openCardsSheet(); toast("Cartão salvo");
  };
  if(c)document.getElementById("delCard").onclick=async()=>{
    const n=state.tx.filter(t=>t.card===c.name).length;
    const ok=await pickModal({
      title:n?`excluir ${c.name}`:"excluir cartão",
      note:n?`${n} ${n===1?"lançamento usa":"lançamentos usam"} este cartão. Sem cartão, ${n===1?"ele passa":"eles passam"} a pesar no saldo no último dia da fatura.`:"",
      options:[{key:"del",label:"excluir cartão",danger:true}]
    });
    if(ok!=="del") return;
    state.cards=state.cards.filter(x=>x.id!==c.id);
    persist(); openCardsSheet(); refresh(); toast("Cartão excluído");
  };
}

/* =================== Auth + sincronização na nuvem =================== */
function setupAuthGate(){
  auth.onAuthStateChanged(u=>{
    if(u){
      authUid=u.uid; authEmail=u.email; hideLogin(); subscribeCloud();
    }else{
      authUid=null; authEmail=null; cloudReady=false; cloudRef=null;
      if(unsub){ unsub(); unsub=null; }
      clearTimeout(loadFallback); loadFallback=null;
      hideLoading(); connSet(false);
      showLogin();
    }
  });
}
let cloudRef=null, loadFallback=null, lastServerSync=null;
function adoptCloud(data){
  state=normalizeState(data);
  applyTheme(); refresh();
}
function subscribeCloud(){
  cloudRef=db.collection("users").doc(authUid);
  showLoading();
  unsub=cloudRef.onSnapshot({includeMetadataChanges:true}, snap=>{
    const md=snap.metadata||{};
    // ignora ecos das nossas próprias gravações ainda não confirmadas
    if(md.hasPendingWrites) return;
    const fromServer=!md.fromCache;
    connSet(!fromServer);                 // snapshot vindo do cache = sem conexão

    if(fromServer){
      cloudReady=true;                    // só libera gravação após falar com o servidor
      clearTimeout(loadFallback);
      if(snap.exists){
        const data=snap.data();
        if(JSON.stringify(data)!==JSON.stringify(state)) adoptCloud(data);
      }else{
        // servidor CONFIRMOU que o documento não existe -> 1º acesso (cria vazio)
        cloudRef.set(state).catch(()=>connSet(true));
      }
      lastServerSync=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      hideLoading();
      if(view.tab==="menu") render();
      if(cutoffNovo){ cutoffNovo=false; persist(); }   // fixa o corte na nuvem
      setTimeout(checarPendencias,650);   // só depois que os dados reais chegaram
    }else{
      // Veio do cache (provavelmente offline). Só serve para PREENCHER a primeira
      // carga, enquanto o servidor não respondeu. Depois que o servidor falou
      // (cloudReady), um snapshot de cache é sempre mais velho que o estado atual
      // e NUNCA pode sobrescrevê-lo — foi assim que já se perdeu dado antes.
      if(snap.exists && !cloudReady){
        const data=snap.data();
        if(JSON.stringify(data)!==JSON.stringify(state)) adoptCloud(data);
        hideLoading();
      }else if(snap.exists){
        hideLoading();
      }else if(!loadFallback){
        // sem resposta do servidor: espera um pouco e mostra o app (vazio) com o aviso
        loadFallback=setTimeout(hideLoading,2500);
      }
    }
  }, ()=>{ connSet(true); hideLoading(); refresh(); });
}
// Sincronização manual (para resolver divergências entre aparelhos)
function forcePull(){
  if(!cloudRef){ toast("Entre na conta primeiro"); return; }
  toast("Baixando da nuvem...");
  cloudRef.get({source:"server"}).then(snap=>{
    if(snap.exists){ adoptCloud(snap.data()); toast("Dados da nuvem carregados"); }
    else toast("A nuvem ainda está vazia");
  }).catch(()=>toast("Sem conexão com a nuvem"));
}
function forcePush(){
  if(!cloudRef){ toast("Entre na conta primeiro"); return; }
  cloudReady=true;
  cloudRef.set(state).then(()=>toast("Enviado para a nuvem")).catch(()=>toast("Sem conexão com a nuvem"));
}

/* Cada tela/painel empilha um "desfazer". Voltar no navegador fecha o topo da pilha

let navStack=[];
function navPush(undo){ navStack.push(undo); try{ history.pushState({d:navStack.length},""); }catch(e){} }

window.addEventListener("popstate", ()=>{
  if(navStack.length){ const undo=navStack.pop(); try{ undo(); }catch(e){} }
});

    if(req) req.call(el).then(()=>{screen.orientation&&screen.orientation.lock&&screen.orientation.lock("portrait").catch(()=>{});}).catch(()=>toast("Tela cheia indisponível neste navegador"));

/* Dispara a ação já no primeiro toque (pointerup), evitando o atraso/engolimento
   do clique sintético no iOS. Um guarda global ignora o "click" que vem logo após
   um pointerup — mesmo que a ação recrie o botão (setas de mês). Toques distintos
   continuam funcionando porque cada um gera seu próprio pointerup. */
let _tapGuard=0;
function onTap(el, fn){
  el.addEventListener("pointerup", e=>{
    if(e.button!=null && e.button>0) return;
    _tapGuard=Date.now();
    fn(e);
  });
  el.addEventListener("click", e=>{
    if(Date.now()-_tapGuard < 700) return;   // clique sintético logo após o toque: ignora
    fn(e);
  });
}

const SALDO_SHORT={entrada:"Entradas",saida:"Saídas",diario:"Diários",economia:"Economias",cartao:"Cartão"};

/* Constrói a tabela de UM mês */
function buildMonthTable(y,m,opts){
  opts=opts||{};
  const cols=TYPE_ORDER;
  const dim=daysInMonth(y,m);
  const bals=dailyBalances(y,m);
  const maxAbs=Math.max(1,...bals.slice(1).map(Math.abs));
  const today=new Date();
  const isToday=d=>today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;
  const dmap=doneMap();
  const sums={};
  monthTxAll(y,m).forEach(t=>{ const d=txDay(t); (sums[d]=sums[d]||{})[t.type]=(sums[d][t.type]||0)+t.amount; });
  const tot=monthTotals(y,m);

  let head=`<tr class="mc-cols"><th class="tcol-day">Dia</th>`;
  cols.forEach(tp=>head+=`<th class="tcol-t">${badge(tp)}<span>${SALDO_SHORT[tp]}</span></th>`);
  head+=`<th class="tcol-bal">Saldos</th></tr>`;

  let body="";
  for(let d=1; d<=dim; d++){
    const ds=dstr(y,m,d), done=!!dmap[ds], row=sums[d]||{};
    let tds="";
    cols.forEach(tp=>{
      const prev = tp==="diario" && !row.diario && row.previsao;
      const slot = prev?"previsao":tp;
      const v=row[slot]||0, zero=!v;
      tds+=`<td class="tval ${zero?'zero':''}"><span class="cellwrap">${badge(slot,zero?'muted':'')}<span class="v">${brl(v)}</span></span></td>`; });
    body+=`<tr data-open="${ds}">
      <td class="tday ${done?'done':''} ${isToday(d)?'today':''}" data-done="${ds}"><span>${d}</span></td>
      ${tds}
      <td class="tbal" style="${balStyle(bals[d],maxAbs)}">${brl(bals[d])}</td>
    </tr>`;
  }

  let foot=`<tr><td class="tday"></td>`;
  cols.forEach(tp=>foot+=`<td class="tval"><span class="cellwrap">${badge(tp)}<span class="v">${brl(tot[tp])}</span></span></td>`);
  foot+=`<td class="tbal"></td></tr>`;

  let colg=`<colgroup><col class="cg-day">`;
  cols.forEach(()=>colg+=`<col class="cg-t">`);
  colg+=`<col class="cg-bal"></colgroup>`;

  return `<table class="stable">${colg}<thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table>`;
}

    </div>
    <div class="monthnav">
      <button class="arrow" data-mo="-1" aria-label="Mês anterior">${IC_PREV}</button>
      <span class="mo">${cap(MN_FULL[view.m])}</span>
      <button class="arrow" data-mo="1" aria-label="Próximo mês">${IC_NEXT}</button>
    </div>
  </div>`;
}
function bindSaldosCtrl(c){
  c.querySelectorAll("[data-yr]").forEach(el=>onTap(el, ()=>{ view.y+=(+el.dataset.yr); render(); }));
  c.querySelectorAll("[data-mo]").forEach(el=>onTap(el, ()=>saldosShiftMonth(+el.dataset.mo)));
}

/* Gesto de arrastar para os lados: ← avança o mês, → volta o mês */
function attachMonthSwipe(el){
  if(!el) return;
  let x0=0,y0=0,on=false,decided=false,horiz=false,swiped=false;
  const start=(x,y)=>{ x0=x;y0=y;on=true;decided=false;horiz=false;swiped=false; };
  const move=(x,y)=>{ if(!on)return; const dx=x-x0,dy=y-y0;
    if(!decided && (Math.abs(dx)>12||Math.abs(dy)>12)){ decided=true; horiz=Math.abs(dx)>Math.abs(dy)*1.3; } };
  const end=(x,y)=>{ if(!on)return; on=false; const dx=x-x0,dy=y-y0;
    if(horiz && Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)){ swiped=true; saldosShiftMonth(dx<0?1:-1); } };
  el.addEventListener("touchstart",e=>{const t=e.touches[0];start(t.clientX,t.clientY);},{passive:true});
  el.addEventListener("touchmove", e=>{const t=e.touches[0];move(t.clientX,t.clientY);},{passive:true});
  el.addEventListener("touchend",  e=>{const t=e.changedTouches[0];end(t.clientX,t.clientY);},{passive:true});
  el.addEventListener("pointerdown",e=>{ if(e.pointerType==="mouse"){start(e.clientX,e.clientY);} });
  el.addEventListener("pointermove",e=>{ if(e.pointerType==="mouse"){move(e.clientX,e.clientY);} });
  el.addEventListener("pointerup",  e=>{ if(e.pointerType==="mouse"){end(e.clientX,e.clientY);} });
  /* evita que o fim de um arrasto dispare o clique de abrir o dia */
  el.addEventListener("click",e=>{ if(swiped){ e.stopPropagation(); e.preventDefault(); swiped=false; } },true);
}

/* Saldos (desktop) — tabela única do mês, com arrastar + animação de deslize */
function renderSaldosMonth(){
  const c=document.getElementById("content");
  const prev=document.getElementById("saldosScroll"); if(prev) saldosScrollY=prev.scrollTop;
  c.innerHTML=saldosCtrlHTML()+`<div class="scroll saldos-scroll" id="saldosScroll">${buildMonthTable(view.y,view.m)}</div>`;
  const ns=document.getElementById("saldosScroll"); if(ns) ns.scrollTop=saldosScrollY;
  bindSaldosCtrl(c); bindSaldosCells(c); attachMonthSwipe(ns);
  if(saldosSlideDir && ns){
    const tbl=ns.querySelector(".stable");
    if(tbl && tbl.animate){
      const from = saldosSlideDir>0 ? "100%" : "-100%";
      tbl.animate([{transform:`translateX(${from})`,opacity:.35},{transform:"translateX(0)",opacity:1}],
        {duration:300,easing:"cubic-bezier(.22,.61,.36,1)"});
    }
  }
  saldosSlideDir=0;
}

function renderSaldosDesktop(){
  const hdr=document.getElementById("header"); if(hdr) hdr.style.display="none";
  renderSaldosMonth();
}

/* Envolve as funções originais para ativar o modo horizontal sem alterar o mobile */
const _mobileRenderSaldos = renderSaldos;
renderSaldos = function(){ isWide() ? renderSaldosDesktop() : _mobileRenderSaldos(); };

const _baseRender = render;
render = function(){
  document.body.classList.toggle("wide", isWide());
  document.body.dataset.tab = view.tab;
  _baseRender();
  renderSidebar();
};

/* Re-renderiza ao cruzar o ponto de quebra (girar iPad, redimensionar janela) */
if(MQ_WIDE.addEventListener) MQ_WIDE.addEventListener("change", ()=>render());
else if(MQ_WIDE.addListener) MQ_WIDE.addListener(()=>render());

/* =================== Boot =================== */
applyTheme();
if(FB_ON){ render(); setupAuthGate(); }
else{ Store.save(state); render(); setTimeout(checarPendencias,400); }
</script>
